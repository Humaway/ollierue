  }
  function optionsMenu(to) {
    const its = [
      Object.assign(cyc('controls', ['modern', 'tank'], ['Modern', 'Tank']), { label: 'Controls' }),
      Object.assign(cyc('textSpeed', ['slow', 'normal', 'fast'], ['Slow', 'Normal', 'Fast']), { label: 'Text speed' }),
      Object.assign(cyc('textSize', ['normal', 'large'], ['Normal', 'Large']), { label: 'Text size' }),
      ...[['music', 'Music volume'], ['sfx', 'SFX volume'], ['voice', 'Voice volume']].map(([k, l]) => ({ label: l, val: () => VOL.get(k), adj: (d) => { VOL.adj(k, d); applyOptions(); } })),
      Object.assign(cyc('reduceFlashing', [false, true], ['Off', 'On']), { label: 'Reduce flashing' }),
      Object.assign(cyc('objective', [true, false], ['On', 'Off']), { label: 'Objective text' }),
      { label: 'Back', act: to },
    ];
    show('OPTIONS', its, to, { foot: '‹ › Change · NO — Back' });
  }
  function controlsMenu(to) {
    const rows = CONTROLS.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
    show('CONTROLS', [{ label: 'Back', act: to }], to, { html: `<table><tr><th>ACTION</th><th>KEYBOARD AND MOUSE</th><th>GAMEPAD</th><th>TOUCH</th></tr>${rows}</table>` });
  }
  function sceneSelect(to) {
    const its = SCENE_ORDER.map((id) => ({ label: id, sub: (SCENES[id] && SCENES[id].title) || '', act: () => start(id, { select: true }) }));
    its.push({ label: 'Back', act: to });
    show('SCENE SELECT', its, to);
  }
  function saved() { return loadGame() || state; }
  function extras() {
    show('EXTRAS', [
      { label: song ? "Stop Pudding's song" : "Pudding's song", act: toggleSong },
      { label: "Luka's notebook", act: () => cardScreen('NAMES', 'list', { title: 'Names', paper: 'printout', items: NAMES.map((n) => ({ text: saved().names.includes(n) ? n : '— — —', done: saved().names.includes(n) })) }) },
      { label: 'The Bug List', act: () => cardScreen('THE ORIGINAL SPEC', 'list', { frame: true, skull: true, ticks: true,
        items: BUGS.filter((b) => saved().bugs.includes(b.id) || saved().bugs.includes(b.text)).map((b) => ({ text: b.text, done: true })).concat([{ text: DOOR_BUG, done: true }]) }) },
      { label: 'Credits', act: credits },
      { label: 'Back', act: mainMenu },
    ], mainMenu, { sel: head.textContent === 'EXTRAS' ? sel : 0 });
  }
  function toggleSong() {
    if (typeof AUDIO === 'undefined') return;
    if (song) { song.stop(); song = null; if (typeof music === 'function') music('title'); return extras(); }
    const s = saved();
    const lane = (on) => Array.from({ length: 16 }, (_, i) => on.includes(i));
    const pattern = s.pattern || [lane([0, 4, 8, 12]), lane([4, 12]), lane([0, 2, 4, 6, 8, 10, 12, 14]), lane([0, 2, 5, 7, 10, 13])];
    if (typeof music === 'function') music(null, { fade: 0.5 });
    song = AUDIO.song(pattern, { samples: s.samples, onEnd: () => { song = null; if (M.mode === 'menu' && head.textContent === 'EXTRAS') extras(); } });
    extras();
  }
  function cardScreen(h, kind, data) {
    const c = document.createElement('canvas');
    ui.paintCard(c, kind, data);
    show(h, [{ label: 'Back', act: extras }], extras, { body: c });
  }
  function credits() {
    show('CREDITS', [{ label: 'Back', act: extras }], extras, { html: `<div class="cr"><p><b>RUE</b>A comedy adventure. Systems crash. People pick up.</p>
      <p><b>STARRING</b>Luka, 2IC, Optus Redcliffe<br>Chase, casual, eight months in<br>Rue, Business Studies, Trinity College Dublin</p>
      <p><b>WITH</b>Des · Bernie · Declan · Prof. Hartigan · Margaret · Dazza · Luke · Jordan<br>Siobhán · Ronan · Fiachra · Mick · Nuala</p>
      <p><b>MUSIC</b>“Opt Us In (Dublin ’87)” by Pudding</p>
      <p>A work of affectionate parody. Not affiliated with or endorsed by Optus. Rue is a fictional portrayal. This is not how Optus got its name. JARVIS was not, as far as we know, built from a bug list. We can't prove it.</p></div>` });
  }
  function pauseMenu() {
    const its = [{ label: 'Resume', act: M.resume }];
    if (typeof inventory !== 'undefined') its.push({ label: 'Inventory', act: () => { M.resume(); inventory.open(); } });
    if (typeof cam !== 'undefined' && cam.cutscene) its.push({ label: 'Skip Scene', act: () => confirm('Skip?', () => { M.resume(); if (flow.skip) flow.skip(); else flow.skipping = true; }, pauseMenu) });
    its.push({ label: 'Options', act: () => optionsMenu(pauseMenu) });
    its.push({ label: 'Controls', act: () => controlsMenu(pauseMenu) });
    its.push({ label: 'Quit to Title', act: () => confirm('Quit to the title screen? This scene will restart from its beginning.', quit, pauseMenu) });
    show('PAUSED', its, M.resume);
  }

  // ---------------------------------------------------------- leaving the title
  function leave() {
    if (song) { song.stop(); song = null; }
    onTitle = false; M.mode = null;
    titleEl.classList.add('off'); root.classList.add('off');
    if (typeof music === 'function') music(null, { fade: 0.8 });
  }
  function start(id, o) { leave(); state = newState(); flow.start(id, o); }
  function newGame() { start('1.1'); }
  function cont() { const s = loadGame(); if (!s) return; leave(); state = s; flow.start(s.scene); }
  function quit() {
    M.resume();
    if (typeof flow !== 'undefined' && flow.stop) flow.stop();
    M.title();
  }
  function orbit() {
    try { cam.shot({ shot: 'MID', on: 'brick_phone', angle: 'high', move: 'orbit', from: 0, to: 360, dur: 240 }); }
    catch (e) { try { cam.override('set', { name: 'title_orbit' }); } catch (e2) { /* no camera yet */ } }
  }

  M.init = () => {
    on('key', (code) => { // J-A-R-V-I-S on the title opens the scene select
      if (!onTitle || M.mode === 'wait' || !code.startsWith('Key')) return;
      typed = (typed + code[3]).slice(-6);
      if (typed === 'JARVIS') { typed = ''; titleEl.classList.add('withmenu'); sceneSelect(mainMenu); }
    });
  };
  M.title = async () => {
    M.paused = false; clock.paused = false; clock.scale = 1;
    ui.reset();
    if (!profile.seenPrologue) { profile.seenPrologue = true; saveOptions(); }
    if (TEST.auto) { // autoplay never stops at the title: P runs into 1.1; anything else means we're done
      if (!RUE_TEST.done && TEST.stop !== 'P' && flow.sceneId === 'P') { state = newState(); flow.start('1.1'); }
      else RUE_TEST.done = true;
      return;
    }
    M.mode = 'wait'; onTitle = true; typed = '';
    root.classList.add('off');
    await ui.fade(1, 0.4);
    try {
      if (world.setId !== 'office') await world.load('office', { env: 'dark' }); else world.env('dark');
      for (const id of (world.actors instanceof Map ? [...world.actors.keys()] : Object.keys(world.actors || {}))) world.despawn(id);
      if (typeof player !== 'undefined') player.enabled = false;
      orbit(); orbitT = 0;
    } catch (e) { console.warn('RUE: title scene', e); }
    if (typeof music === 'function') music('title');
    titleEl.classList.remove('off', 'withmenu');
    M.mode = 'press';
    ui.fade(0, 1.2);
  };
  M.pause = () => { M.paused = true; clock.paused = true; pauseMenu(); };
  M.resume = () => { M.paused = false; clock.paused = false; M.mode = null; root.classList.add('off'); };
  M.update = () => {
    if (onTitle && (orbitT += CONFIG.step) > 240) { orbitT = 0; orbit(); }
    if (M.mode === null) {
      if (input.pressed('pause') && typeof flow !== 'undefined' && flow.sceneId) { input.consume('pause'); M.pause(); }
      return;
    }
    if (M.mode === 'press') {
      if (input.pressed('yes')) { input.consume('yes'); ui.sfx('chime_ready'); titleEl.classList.add('withmenu'); mainMenu(); }
      return;
    }
    if (M.mode !== 'menu') return;
    const n = items.length;
    if (input.pressed('up')) { sel = (sel - 1 + n) % n; paint(); }
    if (input.pressed('down')) { sel = (sel + 1) % n; paint(); }
    const it = items[sel];
    if (it && it.adj && (input.pressed('left') || input.pressed('right'))) { it.adj(input.pressed('left') ? -1 : 1); paint(); }
    if (input.pressed('yes')) act();
    else if ((input.pressed('no') || (M.paused && input.pressed('pause'))) && back) back();
    for (let i = 0; i < M.keys.length; i++) input.consume(M.keys[i]);
  };
  M.keys = ['yes', 'no', 'up', 'down', 'left', 'right', 'pause', 'inventory', 'swap'];
  return M;
})();

// ------------------------------------------------------------ CARDS: readable INSERT close-ups
// Each painter draws just the object on a transparent canvas (ui.card adds nothing else). `.size` = native px.

      if (g[k]) for (const v of g[k]) if (!state[to].includes(v)) state[to].push(v);
    for (const k of ['battery', 'bars', 'pattern', 'active']) if (k in g) state[k] = g[k];
  }

  // ---------------------------------------------------------- sets and actors
  async function loadSet(id, env) {

  }

  }
  function recontrol() {

  function showSwap() {

  }
  function doSwap() {

  // ---------------------------------------------------------- cutscene steps
  function runAny(x) { return typeof x === 'function' ? x(ctx()) : playCutscene(x, { letterbox: false }); }

  async function runSteps(steps, o) {
    if (!steps) return;
    if (o && o.letterbox) ui.letterbox(true);
    const g = G;
    for (let i = 0; i < steps.length; i++) {
      if (g !== G) return;
      try { const p = step(steps[i]); if (p) await p; } catch (e) { console.error('RUE: step failed', steps[i], e); }
    }
  }

  async function playCutscene(c, o = {}) {
    const steps = typeof c === 'string' ? CUTSCENES[c] : c;
    if (!steps) { console.warn('RUE: no cutscene ' + c); return; }
    if (typeof c === 'string') testLog('cutscene ' + c);
    const g = G, lb = o.letterbox !== false;
    cutDepth++;
    player.enabled = false; ui.prompt(null); hotspots.reset();
    if (lb) ui.letterbox(true);
    await runSteps(steps);
    if (g !== G) return;
    cutDepth--;
    if (cutDepth) return;
    if (cardOn) { ui.card(null); cardOn = false; }
    if (!o.keep) { // the last shot eases into the gameplay camera as the bars slide away
      if (lb) ui.letterbox(false);
      if (cam.cutscene) await cam.release(flow.skipping ? 0 : 0.8);
      if (g !== G) return;
    }
    if (!cutDepth) { flow.skipping = false; clock.scale = 1; }
    if (flow.roaming && !flow.busy) player.enabled = true;
  }

  function step(s) {
    const sk = flow.skipping;
    if ('shot' in s) {
      if (sk) return;
      cam.shot(s);
      if (s.card) { ui.card(s.card[0], s.card[1]); cardOn = true; } else if (cardOn) { ui.card(null); cardOn = false; }
      return;
    }
    if ('say' in s) {
      if (sk) return;
      const a = world.actor(s.say); // optional cues on a line: {say, text, expr: 'worried', act: 'lanyard'}
      if (a && s.expr) a.setExpr(s.expr);
      if (a && typeof s.act === 'string') a.play(s.act);
      return say(s.say, s.text, s);
    }
    if ('choice' in s) return choose(s.choice, s).then((i) => { flow.result = i; if (s.flag) setFlag(s.flag, i); });
    if ('ask' in s) return ask(s.ask, s).then((v) => { flow.result = v; if (s.flag) setFlag(s.flag, v); return runSteps(v ? s.yes : s.no); });
    if ('popup' in s) {
      if (s.clear) popup.clear();
      if (!s.popup || sk) return;
      const p = popup(s.popup);
      if (s.wait) return p.done.then((i) => { flow.result = i; });
      return;
    }
    if ('set' in s) return changeSet(s.set, s.env, s.spawn);
    if ('hold' in s) { const a = actorOf(s.hold); if (a) a.hold(s.prop ?? null, s.hand); return; }
    if ('music' in s) { mus(s.music, sk ? { cut: true } : s); return; }
    if ('par' in s) return Promise.all(s.par.map((x) => runSteps([x])));
    if ('if' in s) return runSteps(s.if(state) ? s.then : s.else);
    if ('do' in s) return s.do(ctx());
    if ('stare' in s) return stare(s);
    if ('move' in s) return move(s);
    if ('face' in s) { const a = actorOf(s.face); if (a) a.face(s.to, sk ? 0 : s.dur); return; }
    if ('expr' in s) { for (const [id, e] of s.expr) { const a = actorOf(id); if (a) a.setExpr(e); } return; }
    if ('act' in s) { for (const [id, anim, o] of s.act) { const a = actorOf(id); if (a) a.play(anim, o || {}); } return; }
    if ('spawn' in s) { world.spawn(s.spawn, s.at, s); return; }
    if ('despawn' in s) { world.despawn(s.despawn); return; }
    if ('place' in s) { const a = actorOf(s.place); if (a) a.place(s.at); return; }
    if ('prop' in s) {
      const o = world.prop(s.prop);
      if (!o) { console.warn('RUE: no prop ' + s.prop); return; }
      if ('visible' in s) o.visible = s.visible;
      if (s.pos) o.position.set(s.pos[0], s.pos[1], s.pos[2]);
      if ('rotY' in s) o.rotation.y = s.rotY;
      if (s.fn) s.fn(o);
      return;
    }
    if ('sfx' in s) { if (!sk) ui.sfx(s.sfx, s); return; }
    if ('loop' in s) {
      const l = loops[s.loop] || (loops[s.loop] = []), A = audio();
      if (s.stop) { for (const h of l) h.stop(s.fade ?? 0.5); l.length = 0; } else if (A) l.push(A.loop(s.loop, s));
      return;
    }
    if ('wait' in s) return wait(s.wait);
    if ('flash' in s) return ui.flash(s.flash, s.color);
    if ('fade' in s) return ui.fade(s.fade, s.dur ?? 0.5, s.color);
    if ('letterbox' in s) { ui.letterbox(s.letterbox); return; }
    if ('hud' in s) { if (!s.hud) hud.set(null); else if (s.anim) hud.animate(s.hud, s.anim); else hud.set(s.hud); return; }
    if ('flag' in s) { setFlag(s.flag, 'value' in s ? s.value : true); return; }
    if ('item' in s) {
      if (s.remove) inventory.remove(s.item);
      else if (!inventory.has(s.item)) { inventory.add(s.item); ui.toast('New item: ' + itemName(s.item)); }
      return;
    }
    if ('name' in s) { learnName(s.name); return; }
    if ('sample' in s) { learnSample(s.sample); return; }
    if ('objective' in s) { if (Array.isArray(s.objective)) objective.list(s.objective); else objective(s.objective); return; }
    if ('env' in s) { world.env(s.env, sk ? 0 : s.dur || 0); return; }
    if ('split' in s) {

      const sp = s.split, g = G;
      return Promise.all([world.preload(sp.left.set), world.preload(sp.right.set)]).then(() => { if (g === G) world.split(sp, s); });
    }

    if ('title' in s) return ui.title(s.title, s.dur);
    if ('actCard' in s) return ui.actCard(s.actCard);
    console.warn('RUE: unknown step', s);
  }

  function move(s) {
    const a = actorOf(s.move);
    if (!a) return;
    if (flow.skipping) { a.place(s.to); return; }
    const p = a.moveTo(s.to, s);
    if (s.nowait) return;
    let done = false;
    p.then(() => { done = true; });
    return waitUntil(() => done).then(() => { if (!done) a.place(s.to); }); // skipped mid-walk: jump there
  }

  // The stare: camera locked, music silent, no UI; the world and its ambient sounds carry on.
  function stare(s) {
    if (flow.skipping) return;
    const len = Math.min(4, s.stare || 3), amb = (s.ambient || []).slice().sort((a, b) => a[1] - b[1]), t0 = clock.t;
    let k = 0;
    cam.lock(true); silence(true); ui.prompt(null); hudEl.style.visibility = 'hidden';
    return waitUntil(() => {
      const t = clock.t - t0;
      for (; k < amb.length && amb[k][1] <= t; k++) ui.sfx(amb[k][0]);
      if (t >= len) return true;
      if (t >= 1 && input.pressed('yes')) { input.consume('yes'); return true; }
      return false;
    }).then(() => { cam.lock(false); silence(false); hudEl.style.visibility = ''; });
  }

  function timelapse(tl) {
    const keys = tl.keys || [], fired = keys.map(() => false);
    const fire = (i) => { if (fired[i]) return; fired[i] = true; return runSteps(keys[i].steps); };
    const rest = async () => { for (let i = 0; i < keys.length; i++) await fire(i); }; // keys a skip jumped over still apply
    if (flow.skipping) return rest();
    let done = false;
    world.timelapse(Object.assign({}, tl, { keys: keys.map((k, i) => ({ t: k.t, do() { fire(i); } })) })).then(() => { done = true; });
    return waitUntil(() => done).then(rest);
  }

  // ---------------------------------------------------------- busy runs (hotspot actions, inventory, hints)
  async function busyRun(fn) {
    const g = G;
    flow.busy = true; player.enabled = false; ui.prompt(null); hotspots.reset();
    try { await fn(); } catch (e) { console.error('RUE: action failed', e); }
    if (g !== G) return;
    flow.busy = false;
    if (flow.roaming) player.enabled = true;
  }

  // ---------------------------------------------------------- hotspots
  const hotspots = (() => {
    const list = [], used = new Set();
    let near = null, nearSel = null, holdH = null, holdT = 0, holdOn = false, hx = 0, hz = 0;
    const canRecord = (h) => !!h.sample && inventory.has('recorder') && !state.samples.includes(h.sample);
    const acts = (h) => !!(h.text != null || h.steps || h.ask || h.use || h.kettle || h.door || h.do);
    function live(h) {
      if (used.has(h) || (h.once && h.flag && state.flags[h.flag])) return false;
      if (h.only && h.only !== state.active) return false;
      if (h.when && !h.when(state)) return false;
      return acts(h) || canRecord(h);
    }
    function where(h) { // -> hx, hz; false when the spot isn't in this set
      const at = h.at ?? h.id;
      if (Array.isArray(at)) { hx = at[0]; hz = at[2]; return true; }
      const a = world.actor(at);
      if (a) { hx = a.pos.x; hz = a.pos.z; return a !== player.actor; }
      if (h._set !== world.setId) { // anchors/marks don't move: resolve once per set
        h._set = world.setId;
        const an = world.anchor(at), p = an ? an.at : world.mark(at);
        h._x = p ? p.x ?? p[0] : NaN; h._z = p ? p.z ?? p[2] : NaN;
      }
      hx = h._x; hz = h._z;
      return hx === hx;
    }
    function label(h) {
      const sel = inventory.selected;
      if (sel) return 'YES — Use ' + itemName(sel);
      const v = h.verb || 'Examine', base = v === 'YES' || v === 'NO' ? v : 'YES — ' + v;
      if (!canRecord(h)) return base;
      return acts(h) ? base + ' · hold to record' : 'YES — Hold to record';
    }
    function update(dt) {
      const me = player.actor;
      if (!me) return;
      if (holdH) { // hold YES for 1 s with the recorder; a tap does the spot's normal action
        const h = holdH;
        if (input.held('yes')) {
          holdT += dt;
          if (holdT >= 0.2 && !holdOn) { holdOn = true; ui.prompt('YES — Recording…'); ui.sfx('dictaphone'); }
          if (holdT < 1) return;
          holdH = null; near = null; player.enabled = true;
          ui.sfx((SAMPLES[h.sample] && SAMPLES[h.sample].sfx) || 'beep');
          learnSample(h.sample);
          return;
        }
        holdH = null; near = null; player.enabled = true;
        if (acts(h)) busyRun(() => fire(h));
        return;
      }
      let best = null, bd = 1e9;
      for (let i = 0; i < list.length; i++) {
        const h = list[i];
        if (!live(h) || !where(h)) continue;
        const dx = hx - me.pos.x, dz = hz - me.pos.z, d = dx * dx + dz * dz, r = h.r || 1.2;
        if (d <= r * r && d < bd) { bd = d; best = h; }
      }
      if (best !== near || inventory.selected !== nearSel) { near = best; nearSel = inventory.selected; ui.prompt(best ? label(best) : null); }
      if (!best) { if (inventory.selected && input.pressed('no')) { input.consume('no'); inventory.selected = null; } return; }
      const key = best.verb === 'NO' && !inventory.selected ? 'no' : 'yes';
      if (!input.pressed(key)) return;
      input.consume(key);

      busyRun(() => fire(best));
    }
    function speak(h) {
      let t = h.text, who = h.by || state.active;
      if (Array.isArray(t)) { h._n = ((h._n ?? -1) + 1) % t.length; t = t[h._n]; }
      if (t && typeof t === 'object') { const k = state.active in t ? state.active : Object.keys(t)[0]; if (!h.by) who = k; t = t[k]; }
      return say(who, t);
    }
    async function kettle(h) {
      if (!(await ask('Put the kettle on?'))) return false;
      if (player.actor && where(h)) player.actor.face([hx, hz]);
      ui.sfx('kettle'); // boils, clicks off, steam rises
      const at = h.at ?? h.id, steam = { n: 16, speed: 0.25, life: 1.8, color: 0xf2f2f2 };
      await wait(1.8); world.puff(at, steam);
      await wait(1.4); world.puff(at, steam);
      return true;
    }
    function placeParty(mark) { // spawn (not place) so actors also move across into a new set
      const f = flow.follow, m = typeof mark === 'string' ? world.mark(mark) : mark;
      world.spawn(state.active, mark);
      if (f && m) { const r = m[3] || 0; world.spawn(f, [m[0] - Math.sin(r) * 0.8, m[1], m[2] - Math.cos(r) * 0.8, r]); }
      recontrol();
    }
    async function door(h) {
      const d = h.door, kind = d.kind || 'jarvis', to = d.to && typeof d.to === 'object' && !Array.isArray(d.to) ? d.to : { mark: d.to };
      if (kind === 'jarvis') { // "takes nine seconds": ~2 s of spinner, then a jump cut
        const p = popup({ msg: 'JARVIS is loading this door.', spinner: true, buttons: [], icon: 'info' });
        const key = 'door_seen_' + h.id, first = d.first && !state.flags[key];
        if (first) state.flags[key] = true;
        await Promise.all([wait(2), first ? playCutscene(d.first, { letterbox: false }) : null]);
        p.close();
      } else if (kind === 'wood') { ui.sfx('creak'); await ui.fade(1, 0.35); }
      else ui.sfx('door_slide');
      if (to.set && to.set !== world.setId) { if (kind !== 'wood') await ui.fade(1, 0.25); await loadSet(to.set, to.env); }
      placeParty(to.mark);
      if (kind === 'wood' || to.set) ui.fade(0, 0.35);
    }
    async function fire(h) {
      const sel = inventory.selected;
      let done = true, boiled = false;
      inventory.selected = null;
      testLog('hotspot ' + h.id + (sel ? ' use ' + sel : ''));
      if (sel) {
        const u = h.use && h.use[sel];

        await runAny(u);

      }

    }
    return {
      list, used, update,
      reset() { near = null; holdH = null; },
      add(h) { list.push(h); },
      remove(id) { const i = list.findIndex((h) => h.id === id); if (i >= 0) list.splice(i, 1); },
      trigger(x) { // run a spot by id (autoplay helpers, content)
        const h = typeof x === 'string' ? list.find((e) => e.id === x) : x;

        return busyRun(() => fire(h));
      },
    };
  })();

  // ---------------------------------------------------------- inventory
  const inventory = {
    selected: null,
    has: (id) => state.inventory.includes(id),
    add(id) { if (state.inventory.includes(id)) return; state.inventory.push(id); emit('item:add', id); },
    remove(id) {
      const i = state.inventory.indexOf(id);
      if (i >= 0) state.inventory.splice(i, 1);
      if (inventory.selected === id) inventory.selected = null;
    },
    open() {
      if (panelOpen) return;
      const free = (flow.roaming || mg) && !flow.busy && !cutDepth; // actions only in play, never mid-cutscene
      panelOpen = true;
      const pe = player.enabled;
      player.enabled = false; ui.prompt(null); hotspots.reset();
      const close = () => { panelOpen = false; player.enabled = pe; };
      const act = (fn) => { close(); if (free) busyRun(fn); };
      ui.inventoryPanel({
        items: state.inventory.map((id) => ({ id, name: itemName(id), icon: ITEMS[id] && ITEMS[id].icon })),
        onExamine: (id) => act(async () => {
          const it = ITEMS[id] || {};
          if (it.examine) await runAny(it.examine); else await say(state.active, it.desc || itemName(id));
          if (it.flip && (await ask(it.flip.q || 'Flip it?', it.flip))) await runAny(it.flip.steps);
        }),
        onUse: (id) => { close(); if (free) { inventory.selected = id; ui.toast('Using: ' + itemName(id)); } },
        onCombine: (a, b) => act(() => {
          const c = (ITEMS[a] && ITEMS[a].combine && ITEMS[a].combine[b]) || (ITEMS[b] && ITEMS[b].combine && ITEMS[b].combine[a]);
          return c ? runAny(c) : say(state.active, "That won't work.");

  // ---------------------------------------------------------- minigame host
  function clearOverlay() {
    const c = ovEl.getContext('2d'), d = devicePixelRatio || 1;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, ovEl.width, ovEl.height); c.setTransform(d, 0, 0, d, 0, 0);
  }
  function minigame(id, params) {
    const m = MINIGAMES[id];
    if (!m) { console.warn('RUE: minigame ' + id + ' is not built'); return Promise.resolve({ missing: true }); }
    testLog('minigame ' + id);
    clearOverlay(); ovEl.classList.remove('off'); mgEl.textContent = '';
    return new Promise((res) => {
      const me = { m, paused: 0, api: null };
      const api = me.api = {
        finish(r) {
          if (mg !== me) return;
          mg = null;
          try { if (m.end) m.end(r); } catch (e) { console.error('RUE: minigame ' + id + ' end()', e); }
          clearOverlay(); ovEl.classList.remove('off'); mgEl.textContent = '';
          flow.result = r; res(r);
        },
        overlay: { canvas: ovEl, ctx: ovEl.getContext('2d'), get w() { return innerWidth; }, get h() { return innerHeight; },
          show(b) { ovEl.classList.toggle('off', !b); } },
        ui: mgEl, world, cam, input, sfx: typeof sfx === 'function' ? sfx : sfxFn, AUDIO: audio(), say, ask, choose, popup, hud,
        async play(steps) { me.paused++; try { await runSteps(steps); } finally { me.paused--; } },
        params: params || {}, state,
      };
      mg = me;
      try {
        m.start(api.params, api);
        if (TEST.auto) {
          if (m.autoplay) Promise.resolve(m.autoplay(api)).catch((e) => { console.error('RUE: minigame ' + id + ' autoplay()', e); api.finish({ error: true }); });
          else wait(0.5).then(() => api.finish({ auto: true }));
        }
      } catch (e) { console.error('RUE: minigame ' + id + ' start()', e); api.finish({ error: true }); }
    });
  }

  // ---------------------------------------------------------- per tick / per frame
  function tick(dt) {
    clock.scale = cutDepth && input.held('no') ? 3 : 1; // hold NO to fast-forward a cutscene
    if (mg && !mg.paused && !panelOpen && !flow.busy && mg.m.update) {
      try { mg.m.update(dt); } catch (e) { console.error('RUE: minigame update()', e); mg.api.finish({ error: true }); }
    }
    if (!flow.roaming || flow.busy || panelOpen || cutDepth) return;
    if (input.pressed('inventory')) { input.consume('inventory'); inventory.open(); return; }
    if (flow.swap && input.pressed('swap')) { input.consume('swap'); doSwap(); }
    hotspots.update(dt);
  }
  function draw() {
    if (!mg || !mg.m.draw) return;
    try { mg.m.draw(); } catch (e) { console.error('RUE: minigame draw()', e); mg.api.finish({ error: true }); }
  }

  // ---------------------------------------------------------- roam
  async function roam(o) {
    const g = G, u = o.until;
    const solved = () => {
      if (typeof u === 'function') return !!u(state);
      if (Array.isArray(u)) { for (let i = 0; i < u.length; i++) if (!state.flags[u[i]]) return false; return true; }
      return u ? !!state.flags[u] : false;
    };
    if (TEST.auto) {
      if (o.auto) await o.auto(ctx());
      else if (typeof u !== 'function') for (const f of [].concat(u || [])) setFlag(f, true);
      if (u && !solved()) console.warn('RUE: roam auto() left `until` unsolved in ' + flow.sceneId);
      return;
    }
    flow.roaming = true; player.enabled = true; hotspots.reset(); showSwap();
    const t0 = clock.t;
    let hinted = !o.hint;
    await waitUntil(() => {
      if (g !== G) return true;

// ============================================================ MINIGAME: Pedal Power (2.6, reused in 3.1)
// 100 BPM bleep beat. Alternate two buttons on the beat: in-time presses pull the speed meter

// Progress fills only in the green (~45 s a session). >90% for over a second = sparks, -10% progress.

MINIGAMES.pedal = (() => {
  const BEAT = 0.6, T0 = 1.2, WIN = 0.16, FAIL = 70, FILL = 100 / 42;
  const F = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  const F12 = '12px ' + F, F13 = '13px ' + F, F14B = 'bold 14px ' + F, F15B = 'bold 15px ' + F, F16B = 'bold 16px ' + F;
  const SPK = new Float32Array(20 * 5);
  let api, p, ov, ctx, W = 0, H = 0, sch = '', rider = null, dyn = null, done = true;
  let lo = 55, hi = 80, target = 77, t = 0, m = 0, prog = 0, over = 0, beeped = 0, judged = 0, hitK = -1, last = -1;
  let fb = 0, fbTxt = '', beatFlash = 0, spin = 0, sparkT = 0, endT = -1, lastSpd = -1, lastRate = -1;

    hintTxt = s === 'kb' ? 'Alternate ← → (or YES / NO) on the beep' : 'Alternate ' + labA + ' and ' + labB + ' on the beep';
  }

  function finish(r) { if (done) return; done = true; if (dyn) dyn.stop(0.5); dyn = null; api.finish(r); }

  function win(a) {
    state.battery = (state.battery || 0) + 1;
    a.hud.set({ battery: state.battery, bars: state.bars });
  }

  return {
    start(params, a) {
      api = a; p = params || a.params || {}; ov = a.overlay; ctx = ov.ctx; done = false; W = 0;
      const b = p.band || [55, 80]; lo = b[0]; hi = b[1]; target = (lo + hi) / 2 + 10; session = p.session || 1;
      t = m = prog = over = 0; beeped = judged = 0; hitK = last = -1; fb = beatFlash = spin = sparkT = 0; endT = -1; lastSpd = lastRate = -1; pctN = -1;
      for (let k = 0; k < SPK.length; k += 5) SPK[k + 4] = 0;
      sessTxt = 'SESSION ' + session + ' / 3';
      rider = a.world.actor(p.rider || 'luka') || null;
      dyn = (a.AUDIO && a.AUDIO.loop && a.AUDIO.loop('dynamo', { vol: 0, rate: 0.5 })) || null;

    },
    update(dt) {

    },
    draw() {

      const s = ov.canvas.width / W;
      ctx.setTransform(s, 0, 0, s, 0, 0); ctx.clearRect(0, 0, W, H);
      ctx.textBaseline = 'middle';

      const pw = Math.min(560, W - 24), ph = 176, px = (W - pw) / 2 + (sparkT > 0 ? Math.sin(sparkT * 90) * 5 : 0);
      const py = H - ph - (api.input.scheme === 'touch' ? 200 : 22);
      ctx.fillStyle = 'rgba(20,29,58,0.9)'; ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 14); ctx.fill();
      ctx.fillStyle = CONFIG.colors.yes; ctx.fillRect(px + 10, py, pw - 20, 2);
      ctx.font = F15B; ctx.textAlign = 'left'; ctx.fillStyle = CONFIG.colors.yes; ctx.fillText('PEDAL POWER', px + 16, py + 20);
      ctx.textAlign = 'right'; ctx.fillStyle = '#c9d2ea'; ctx.font = F13; ctx.fillText(sessTxt, px + pw - 16, py + 20);

      ctx.lineWidth = 7; ctx.strokeStyle = '#0b0d14'; ctx.beginPath(); ctx.arc(wx, wy, wr, 0, 6.283); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = '#aab3c5'; ctx.beginPath(); ctx.arc(wx, wy, wr - 5, 0, 6.283);
      for (let k = 0; k < 8; k++) { const a = spin + k * 0.785; ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a) * (wr - 5), wy + Math.sin(a) * (wr - 5)); }
      ctx.stroke();
      ctx.fillStyle = '#dfe4f2'; ctx.beginPath(); ctx.arc(wx, wy, 4, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#e5484d'; ctx.beginPath(); ctx.roundRect(wx + wr - 4, wy - 22, 12, 20, 3); ctx.fill(); // the dynamo
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#ffe14a'; ctx.beginPath();
      for (let k = 0; k < SPK.length; k += 5) if (SPK[k + 4] > 0) {
        const x = wx + wr + 2 + SPK[k], y = wy - 12 + SPK[k + 1];

      }
      ctx.stroke();

      // speed meter: green band, red zone above 90, the needle

      ctx.fillStyle = '#9b2c2c'; ctx.fillRect(mx + 0.9 * mw, my + 2, 0.1 * mw - 2, mh - 4);

      ctx.fillRect(mx + 2, my + mh / 2 - 3, Math.max(0, m / 100 * mw - 2), 6);
      ctx.fillRect(mx + m / 100 * mw - 2, my - 5, 4, mh + 10);
      ctx.font = F12; ctx.textAlign = 'left'; ctx.fillStyle = '#97a2c2'; ctx.fillText('SPEED', mx, my - 10);
      ctx.textAlign = 'right';
      ctx.fillStyle = m > 90 ? '#ff8a80' : inG ? '#7dffb0' : m < lo - 20 && t > 3 ? '#ffb3a8' : '#97a2c2';
      ctx.fillText(m > 90 ? 'TOO FAST' : inG ? 'GOOD' : m < lo - 20 && t > 3 ? 'STALLING' : m < lo ? 'FASTER' : 'EASE OFF', mx + mw, my - 10);

// ============================================================ MINIGAMES: Pitch Cards (3.1), Customer Journey (2.10), the Sequencer (3.3)
// Overlay mini-games (SPEC §14). One shared private scope; only one mini-game runs at a time.

Object.assign(MINIGAMES, (() => {
  const F = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  const HAND = '"Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive';
  const MONO = '"Courier New", ui-monospace, Menlo, Consolas, monospace';
  const DASH = [5, 5], NODASH = [], NUMS = ['1', '2', '3', '4', '5', '6', '7', '8', '9'], F10M = '10px ' + MONO;
  let api, ov, ctx, W = 0, H = 0, touchEl = null, lpx = -1, lpy = -1, onSize = null, sch = '';

  function open(a, layout) {
    api = a; ov = a.overlay; ctx = ov.ctx; W = H = 0; sch = ''; onSize = layout;
    touchEl = document.getElementById('touch'); lpx = a.input.pointer.x; lpy = a.input.pointer.y;
    ov.show(true);
  }
  function close() {
    if (ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, ov.canvas.width, ov.canvas.height); }
    if (ov) ov.show(false);
  }
  function size() { if (W !== innerWidth || H !== innerHeight || sch !== api.input.scheme) { W = innerWidth; H = innerHeight; sch = api.input.scheme; onSize(); } }
  function clear() { const s = ov.canvas.width / W; ctx.setTransform(s, 0, 0, s, 0, 0); ctx.clearRect(0, 0, W, H); }

  const NOTES = {
    Des: 'Front Gate, 31 years', Bernie: 'Toast for half the college', Declan: 'Machines for shop workers',
    Ronan: 'Sleeps. Still turns up.', 'Siobhán': 'Learned the whole module', Fiachra: 'Four notes now',
    Mick: 'Won a battle (pigeons)', Nuala: 'Minds the old library', Hartigan: 'Never once late',
  };

  const STEP_NOTES = { GREET: 'say hello first', ASK: 'what do they need?', LISTEN: 'actually listen', RECOMMEND: 'the right thing for them' };
  const Lst = [], Rst = [];
  let mode = '', done = true, drag = null, held = null, dox = 0, doy = 0, dsx = 0, dsy = 0, moved = false;
  let tside = 0, tidx = 0, fside = 0, fidx = 0, kb = false, checkT = -1, endT = -1, okT = 0, slowT = 0;
  let colX0 = 0, colX1 = 0, colW = 0, cw = 0, top = 0, cardH = 0, gap = 8, rowsN = 4, bx = 0, by = 0, bw = 0, bh = 0;
  let fTitle = '', fHint = '', fHead = '', fName = '', fSub = '', fNum = '', fBtn = '';
  let title = '', titleS = '', headL = '', headR = '', hintP = '', hintK = '', hx = 0;

  const rowY = (i) => top + 40 + i * (cardH + gap);
  const xL = () => colX0 + 30, xR = () => colX1 + (colW - cw) / 2;

  function tableLayout() {
    const touch = sch === 'touch', foot = (mode === 'pitch' ? 74 : 16) + (touch ? 190 : 8);
    top = touch ? 118 : W < 560 ? 92 : 84; gap = 8; hx = W < 600 ? 16 : W / 2;
    colW = Math.min(330, (W - 36) / 2); colX0 = W / 2 - colW - 6; colX1 = W / 2 + 6; cw = colW - 40;
    cardH = Math.floor(Math.max(34, Math.min(68, (H - top - 48 - foot - (rowsN - 1) * gap) / rowsN)));

    const k = Math.min(1, W / 700);

    fHead = 'bold ' + Math.round(11 + 3 * k) + 'px ' + F; fBtn = 'bold ' + Math.round(14 + 3 * k) + 'px ' + F;
    fName = mode === 'pitch' ? 'bold ' + Math.round(Math.min(cardH * 0.4, cw * 0.14)) + 'px ' + HAND
      : 'bold ' + Math.round(Math.min(cardH * 0.36, cw * 0.12)) + 'px ' + F;
    fSub = Math.round(Math.max(10, Math.min(cardH * 0.2, cw * 0.075))) + 'px ' + HAND;
    fNum = 'bold ' + Math.round(Math.min(22, cardH * 0.4)) + 'px ' + HAND;
    for (let i = 0; i < Lst.length; i++) { Lst[i].x = xL(); Lst[i].y = rowY(i); }

      hintP = 'Tap a name to add it. Drag cards to set the order.';

      rowsN = 4;
      title = titleS = 'The customer journey'; headL = 'IN ORDER'; headR = 'SIOBHÁN’S NOTES';

  }

  function tap(c) { if (Rst.indexOf(c) >= 0) moveCard(c, Lst); else if (c.fixed) refuse(c); else moveCard(c, Rst); }

  }
  function confirm() {
    const order = Lst.map((c) => c.id);
    state.flags.pitchOrder = order;
    done = true; api.sfx('pop'); api.finish({ order });
  }

  function tablePointer() {
    const I = api.input, P = I.pointer;
    if (!ptrOk()) return false;
    if (P.x !== lpx || P.y !== lpy) { kb = false; lpx = P.x; lpy = P.y; }
    if (drag) {

      drag.x = P.x - dox; drag.y = P.y - doy;
      tside = drag.fixed || P.x < W / 2 ? 0 : 1;

        const c = drag; drag = null;
        if (!moved) { tap(c); return true; }

    const dy = I.pressed('up') ? -1 : I.pressed('down') ? 1 : 0, dx = I.pressed('left') ? -1 : I.pressed('right') ? 1 : 0;
    const yes = I.pressed('yes'), no = I.pressed('no');
    if (!(dx || dy || yes || no)) return;
    kb = true;
    if (held) {
      const i = Lst.indexOf(held), j = i + dy;
      if (dy && j >= 0 && j < Lst.length) { Lst[i] = Lst[j]; Lst[j] = held; fidx = j; api.sfx('tick'); }
      if (yes || no) { held = null; api.sfx('pop'); changed(); }
      return;
    }
    if (dx && fside < 2) { const s = fside + dx; if (s >= 0 && s <= 1 && (s ? Rst : Lst).length) { fside = s; fidx = Math.min(fidx, (s ? Rst : Lst).length - 1); } }
    if (dy) {
      if (fside === 2) { if (dy < 0 && Lst.length) { fside = 0; fidx = Lst.length - 1; } }
      else {
        const n = (fside ? Rst : Lst).length;
        fidx += dy;
        if (fidx >= n) { fidx = n - 1; if (mode === 'pitch') fside = 2; }
        if (fidx < 0) fidx = 0;
      }
    }
    if (yes) {
      if (fside === 2) confirm();
      else if (fside === 1) { if (Rst[fidx]) moveCard(Rst[fidx], Lst); }
      else if (Lst[fidx]) { held = Lst[fidx]; api.sfx('tick'); }
    } else if (no && fside === 0 && Lst[fidx]) {
      if (Lst[fidx].fixed) refuse(Lst[fidx]); else moveCard(Lst[fidx], Rst);
    }
  }

  function place(list, side, k) {
    let v = 0;
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      if (c === drag) continue;
      if (drag && tside === side && v === tidx) v++;
      c.tx = side ? xR() : xL(); c.ty = rowY(v++);
      c.x += (c.tx - c.x) * k; c.y += (c.ty - c.y) * k;
      if (c.wob > 0) c.wob -= 1 / 60;
    }
  }

  function tableUpdate(dt) {
    if (done) return;
    size();
    if (okT > 0) okT -= dt;
    if (slowT > 0) slowT -= dt;
    if (endT >= 0) { endT -= dt; if (endT < 0) { done = true; api.finish({ ok: true }); } }
    else if (checkT >= 0) {
      checkT -= dt;
      if (checkT < 0) {
        let ok = true;
        for (let i = 0; i < 4; i++) if (Lst[i].id !== STEPS[i]) ok = false;
        if (ok) { okT = 1; endT = 1.1; api.sfx('chime_ready'); }
        else { // they shuffle back, gently
          api.sfx('clunk'); slowT = 1;
          for (let i = 0; i < 4; i++) Rst.push(Lst[(i * 3 + 1) % 4]);
          Lst.length = 0; fside = 1; fidx = 0;
        }
      }
    } else if (!tablePointer()) tableKeys();
    const k = Math.min(1, dt * (slowT > 0 ? 5 : 16));
    place(Lst, 0, k); place(Rst, 1, k);
  }

  function drawCard(c, x, y, lift, focus, hover) {
    const h = cardH, w = cw;
    if (c.wob > 0) x += Math.sin(c.wob * 60) * 4;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.roundRect(x + (lift ? 5 : 2), y + (lift ? 8 : 3), w, h, 4); ctx.fill();
    ctx.fillStyle = okT > 0 && Lst.indexOf(c) >= 0 ? '#e9fbe6' : hover ? '#fffdf4' : '#fbf5e1';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 4); ctx.fill();
    ctx.fillStyle = '#e6a3a3'; ctx.fillRect(x + 5, y + h * 0.24, w - 10, 1.5);
    ctx.fillStyle = '#cad7ec'; for (let ly = y + h * 0.24 + h * 0.19; ly < y + h - 3; ly += h * 0.19) ctx.fillRect(x + 5, ly, w - 10, 1);
    const sub = c.sub && h >= 44;
    ctx.fillStyle = '#1f2a5a'; ctx.font = fName; ctx.textAlign = mode === 'pitch' ? 'left' : 'center';
    ctx.fillText(c.label, mode === 'pitch' ? x + 12 : x + w / 2, y + h * (sub ? 0.47 : 0.56));
    if (sub) { ctx.fillStyle = '#6a6f80'; ctx.font = fSub; ctx.fillText(c.sub, mode === 'pitch' ? x + 12 : x + w / 2, y + h * 0.8); }
    if (c.fixed) {
      ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(x + w - 13, y + 11, 6, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#f5b7b1'; ctx.beginPath(); ctx.arc(x + w - 15, y + 9, 2, 0, 6.283); ctx.fill();
    }
    if (focus) { ctx.lineWidth = 3; ctx.strokeStyle = CONFIG.colors.yes; ctx.beginPath(); ctx.roundRect(x - 4, y - 4, w + 8, h + 8, 7); ctx.stroke(); }
  }

  function tableDraw() {
    if (done || !W) return;
    clear();
    ctx.textBaseline = 'middle';
    // table top
    ctx.fillStyle = mode === 'pitch' ? '#4a3324' : '#3a4450'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = mode === 'pitch' ? '#3f2b1e' : '#333c47';
    for (let y = 70; y < H; y += 70) ctx.fillRect(0, y, W, 2);
    // header
    ctx.textAlign = hx === 16 ? 'left' : 'center'; ctx.fillStyle = '#fff'; ctx.font = fTitle; ctx.fillText(hx === 16 ? titleS : title, hx, 28);
    ctx.fillStyle = '#e2d6c4'; ctx.font = fHint; ctx.fillText(kb ? hintK : hintP, hx, 56);
    // left column: numbered slots
    const colH = rowsN * (cardH + gap) + 36;
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.roundRect(colX0, top, colW, colH, 10); ctx.fill();
    ctx.fillStyle = CONFIG.colors.yes; ctx.font = fHead; ctx.textAlign = 'left'; ctx.fillText(headL, colX0 + 12, top + 18);
    const slots = mode === 'journey' ? 4 : Lst.length + (drag && tside === 0 && Lst.indexOf(drag) < 0 ? 1 : 0);
    ctx.setLineDash(DASH); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    for (let i = 0; i < slots; i++) {
      ctx.beginPath(); ctx.roundRect(xL(), rowY(i), cw, cardH, 4); ctx.stroke();
    }
    ctx.setLineDash(NODASH);
    if (mode === 'pitch') { ctx.fillStyle = 'rgba(244,236,216,0.55)'; ctx.font = fSub; ctx.textAlign = 'left'; ctx.fillText('Pinned names stay in.', colX0 + 14, top + colH - 14); }
    ctx.fillStyle = '#f4ecd8'; ctx.font = fNum; ctx.textAlign = 'center';
    for (let i = 0; i < slots; i++) ctx.fillText(NUMS[i], colX0 + 16, rowY(i) + cardH / 2);
    // right column: paper
    ctx.fillStyle = mode === 'pitch' ? '#f1f2ec' : '#fbfaf2'; ctx.beginPath(); ctx.roundRect(colX1, top, colW, colH, 4); ctx.fill();
    if (mode === 'pitch') { // continuous-form printout: green bars, tractor holes
      ctx.fillStyle = '#dfeedd'; for (let y = top + 30; y < top + colH - 10; y += 44) ctx.fillRect(colX1 + 14, y, colW - 28, 22);
      ctx.fillStyle = '#4a3324'; for (let y = top + 10; y < top + colH - 4; y += 16) { ctx.beginPath(); ctx.arc(colX1 + 7, y, 3, 0, 6.283); ctx.arc(colX1 + colW - 7, y, 3, 0, 6.283); ctx.fill(); }
      if (colW >= 290) { ctx.fillStyle = '#b8bcc4'; ctx.font = F10M; ctx.textAlign = 'right'; ctx.fillText('JARVIS ERR 4044', colX1 + colW - 16, top + 18); }
    } else {
      ctx.fillStyle = '#d3def0'; for (let y = top + 30; y < top + colH; y += 18) ctx.fillRect(colX1, y, colW, 1);
      ctx.fillStyle = '#eab0b0'; ctx.fillRect(colX1 + 18, top, 1.5, colH);
    }
    ctx.fillStyle = '#2b3350'; ctx.font = fHead; ctx.textAlign = 'left'; ctx.fillText(headR, colX1 + 24, top + 18);
    if (mode === 'pitch' && !Rst.length) { ctx.fillStyle = '#8a8f9c'; ctx.font = fSub; ctx.fillText('(everyone’s in)', colX1 + 24, rowY(0) + cardH / 2); }

    // cards
    const P = api.input.pointer, hov = !kb && !drag && ptrOk() ? hitCard(P.x, P.y) : null;
    for (let i = 0; i < Lst.length; i++) { const c = Lst[i]; if (c !== drag && c !== held) drawCard(c, c.x, c.y, false, kb && fside === 0 && fidx === i, c === hov); }
    for (let i = 0; i < Rst.length; i++) { const c = Rst[i]; if (c !== drag) drawCard(c, c.x, c.y, false, kb && fside === 1 && fidx === i, c === hov); }
    if (held) drawCard(held, held.x - 6, held.y - 4, true, true, false);
    if (drag) {
      ctx.save(); ctx.translate(drag.x + cw / 2, drag.y + cardH / 2); ctx.rotate(-0.04);
      drawCard(drag, -cw / 2, -cardH / 2, true, false, false); ctx.restore();
    }
    // confirm
    if (mode === 'pitch') {
      const f = kb && fside === 2, hb = !kb && inRect(P.x, P.y, bx, by, bw, bh);
      ctx.fillStyle = f || hb ? '#ffe36b' : CONFIG.colors.yes; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 23); ctx.fill();
      if (f) { ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(); }
      ctx.fillStyle = CONFIG.colors.navy; ctx.font = fBtn; ctx.textAlign = 'center'; ctx.fillText('YES — That’s the speech', W / 2, by + bh / 2 + 1);
    }
  }

  const tableEnd = () => { done = true; drag = held = null; close(); };

  // ---------------------------------------------------------- the Sequencer
  // 92 BPM, 4 lanes x 16 steps, green on black. AUDIO.seq plays it (fallback: sfx per step).
  const DEF = [[0, 4, 8, 12], [4, 12], [0, 2, 4, 6, 8, 10, 12, 14], [0, 2, 5, 7, 10, 13]];
  const LANE = [ // sample key, name, role, cell tag, sfx, bleep rate
    ['dynamo', 'DYNAMO', 'KICK', 'DYN', 'dynamo_hit', 0.5], ['till', 'TILL', 'SNARE', 'TIL', 'till', 0.8],
    ['kettle', 'KETTLE', 'HAT', 'KET', 'kettle_click', 1.6], ['whistle', 'WHISTLE', 'LEAD', '', 'whistle', 1],
  ];
  const MEL = ['D-5', 'F#5', 'A-5', 'F#5', 'E-5', 'G-5', 'B-5', 'A-5', 'F#5', 'A-5', 'D-6', 'B-5', 'A-5', 'F#5', 'E-5', 'D-5'];
  const MELL = ['d-5', 'f#5', 'a-5', 'f#5', 'e-5', 'g-5', 'b-5', 'a-5', 'f#5', 'a-5', 'd-6', 'b-5', 'a-5', 'f#5', 'e-5', 'd-5'];
  const MELR = [0, 4, 7, 4, 2, 5, 9, 7, 4, 7, 12, 9, 7, 4, 2, 0].map((n) => Math.pow(2, n / 12));
  const ROWS = []; for (let i = 1; i <= 16; i++) ROWS.push(i < 10 ? '0' + i : '' + i);
  const PAT = [[], [], [], []], HAS = [false, false, false, false], NAME = ['', '', '', ''], TAG = ['', '', '', ''];
  const STEP = 60 / 92 / 4;
  let sDone = true, sr = 0, sc = 0, bsel = 0, playing = false, own = false, acc = 0, playRow = -1, extras = '', extrasN = '', narrow = false, hy = 0;
  let gx = 0, gy = 0, rowH = 0, colW2 = 0, numW = 0, sbw = 0, sbh = 38, sby = 0, fRow = '', fHdr = '', fBig = '', fSm = '', helpTxt = '';
  const onStep = (i) => { playRow = i % 16; };

  function seqLayout() {
    const touch = sch === 'touch', foot = 84 + (touch ? 190 : 6);
    narrow = W < 600; hy = touch ? 40 : 0; gy = 108 + hy;
    rowH = Math.floor(Math.max(16, Math.min(30, (H - gy - foot) / 16)));
    numW = Math.round(Math.max(34, Math.min(56, W * 0.08)));
    colW2 = Math.floor(Math.max(62, Math.min(150, (W - 20 - numW) / 4)));
    gx = Math.round((W - numW - 4 * colW2) / 2 + numW);
    sbw = Math.min(170, (W - 40) / 2); sby = gy + 16 * rowH + 14;
    const f = Math.round(Math.min(rowH * 0.62, colW2 * 0.2));
    fRow = 'bold ' + f + 'px ' + MONO; fHdr = 'bold ' + Math.round(Math.min(15, colW2 * 0.17)) + 'px ' + MONO;
    fBig = 'bold ' + Math.round(Math.min(22, W * 0.05)) + 'px ' + MONO; fSm = Math.round(Math.min(13, W * 0.031)) + 'px ' + MONO;
    helpTxt = touch ? 'TAP A STEP TO TOGGLE IT' : 'ARROWS/MOUSE MOVE · YES TOGGLE · NO PLAY/STOP';
  }

  function play(on) {
    const q = api.AUDIO && api.AUDIO.seq;
    if (on === playing) return;
    playing = on; playRow = -1;
    if (q) { own = false; if (on) q.play(PAT, state.samples, onStep); else q.stop(); }
    else { own = on; acc = STEP; }
  }
  const SO = { rate: 1, vol: 1 }; // reused: the fallback clock fires these every step
  function hitSfx(l, r) {
    SO.rate = l === 3 ? MELR[r] : HAS[l] ? 1 : LANE[l][5]; SO.vol = HAS[l] ? 0.8 : 0.6;
    api.sfx(HAS[l] ? LANE[l][4] : 'beep', SO);
  }
  function toggle(r, c) { PAT[c][r] = !PAT[c][r]; if (PAT[c][r] && !playing) hitSfx(c, r); else api.sfx('tick', { vol: 0.5 }); }
  function seqFinish() {
    play(false);
    state.pattern = PAT.map((l) => l.slice());
    sDone = true; api.finish({ pattern: state.pattern });
  }
  function loadPattern() {
    const sp = state.pattern, ok = Array.isArray(sp) && sp.length === 4 && sp.every((l) => Array.isArray(l) && l.length === 16);
    for (let l = 0; l < 4; l++) { PAT[l].length = 16; for (let i = 0; i < 16; i++) PAT[l][i] = ok ? !!sp[l][i] : DEF[l].includes(i); }
  }

  const sequencer = {
    start(params, a) {
      sDone = false; sr = sc = bsel = 0; playing = own = false; playRow = -1;
      loadPattern();
      const sm = state.samples || [];
      for (let l = 0; l < 4; l++) { HAS[l] = sm.includes(LANE[l][0]); NAME[l] = HAS[l] ? LANE[l][1] : 'BLEEP'; TAG[l] = HAS[l] ? LANE[l][3] : 'BLP'; }
      extras = 'RAIN BED ' + (sm.includes('rain') ? 'ON' : '--') + '   TRILL INTRO ' + (sm.includes('trill') ? 'ON' : '--') + '   BELL ' + (sm.includes('bell') ? 'ON' : '--');
      extrasN = '92 BPM   ' + extras;
      open(a, seqLayout);
    },
    update(dt) {
      if (sDone) return;
      size();
      if (own) { // no AUDIO.seq: tick our own clock and fire one-shots
        acc += dt;
        while (acc >= STEP) { acc -= STEP; playRow = (playRow + 1) % 16; for (let l = 0; l < 4; l++) if (PAT[l][playRow]) hitSfx(l, playRow); }
      }
      const I = api.input, P = I.pointer, ok = ptrOk();
      const col = Math.floor((P.x - gx) / colW2), row = Math.floor((P.y - gy) / rowH);
      const onCell = ok && col >= 0 && col < 4 && row >= 0 && row < 16;
      const onPlay = ok && inRect(P.x, P.y, W / 2 - sbw - 8, sby, sbw, sbh), onFin = ok && inRect(P.x, P.y, W / 2 + 8, sby, sbw, sbh);
      if (ok && (P.x !== lpx || P.y !== lpy)) {
        lpx = P.x; lpy = P.y;
        if (onCell) { sr = row; sc = col; } else if (onPlay || onFin) { sr = 16; bsel = onPlay ? 0 : 1; }
      }
      if (ok && P.pressed && !I.pressed('no')) {
        if (onCell) { sr = row; sc = col; toggle(row, col); }
        else if (onPlay) play(!playing);
        else if (onFin) seqFinish();
        return;
      }
      if (I.pressed('no')) { play(!playing); return; }
      if (I.pressed('up') && sr > 0) sr--;
      if (I.pressed('down') && sr < 16) { sr++; if (sr === 16) bsel = sc < 2 ? 0 : 1; }
      if (I.pressed('left')) { if (sr === 16) bsel = 0; else if (sc > 0) sc--; }
      if (I.pressed('right')) { if (sr === 16) bsel = 1; else if (sc < 3) sc++; }
      if (I.pressed('yes')) { if (sr < 16) toggle(sr, sc); else if (bsel) seqFinish(); else play(!playing); }
    },
    draw() {
      if (sDone || !W) return;
      clear();
      ctx.fillStyle = '#020603'; ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'middle';
      const G = '#39ff6a', D = '#1d6b34', x0 = gx - numW, x1 = gx + 4 * colW2;
      ctx.fillStyle = G; ctx.font = fBig; ctx.textAlign = 'left'; ctx.fillText('PUDDING.SEQ', x0, 26);
      if (!narrow) { ctx.textAlign = 'right'; ctx.fillText('92 BPM', x1, 26); }
      ctx.font = fSm; ctx.fillStyle = D; ctx.textAlign = 'left'; ctx.fillText(narrow ? extrasN : extras, x0, 52);
      ctx.fillStyle = G; ctx.fillRect(x0, 64, x1 - x0, 1);
      for (let l = 0; l < 4; l++) {
        const cx = gx + l * colW2 + colW2 / 2;
        ctx.textAlign = 'center'; ctx.font = fHdr; ctx.fillStyle = HAS[l] ? G : '#c8ffb0'; ctx.fillText(NAME[l], cx, 80 + hy);
        ctx.fillStyle = D; ctx.font = fSm; ctx.fillText(LANE[l][2], cx, 97 + hy);
      }
      ctx.font = fRow;
      for (let r = 0; r < 16; r++) {
        const y = gy + r * rowH;
        if (r === playRow) { ctx.fillStyle = '#0d4020'; ctx.fillRect(x0, y, x1 - x0, rowH); }
        ctx.textAlign = 'left'; ctx.fillStyle = r % 4 === 0 ? G : D; ctx.fillText(ROWS[r], x0 + 2, y + rowH / 2 + 1);
        for (let l = 0; l < 4; l++) {
          const x = gx + l * colW2, on = PAT[l][r], cur = sr === r && sc === l;
          if (cur) { ctx.fillStyle = G; ctx.fillRect(x + 2, y + 1, colW2 - 4, rowH - 2); }
          ctx.fillStyle = cur ? '#021' : on ? G : D; ctx.textAlign = 'center';
          ctx.fillText(l === 3 ? (on ? MEL[r] : MELL[r]) : on ? TAG[l] : '···', x + colW2 / 2, y + rowH / 2 + 1);
        }
      }
      ctx.fillStyle = D; ctx.fillRect(x0, gy + 16 * rowH + 4, x1 - x0, 1);
      for (let b = 0; b < 2; b++) {
        const x = b ? W / 2 + 8 : W / 2 - sbw - 8, f = sr === 16 && bsel === b;
        ctx.fillStyle = f ? G : '#020603'; ctx.fillRect(x, sby, sbw, sbh);
        ctx.lineWidth = 2; ctx.strokeStyle = G; ctx.strokeRect(x + 1, sby + 1, sbw - 2, sbh - 2);
        ctx.fillStyle = f ? '#021' : G; ctx.font = fHdr; ctx.textAlign = 'center';
        ctx.fillText(b ? '[ FINISH ]' : playing ? '[ STOP ]' : '[ PLAY ]', x + sbw / 2, sby + sbh / 2 + 1);
      }
      ctx.fillStyle = D; ctx.font = fSm; ctx.fillText(helpTxt, W / 2, sby + sbh + 20);
    },
    end() { play(false); sDone = true; close(); },
    autoplay(a) { api = a; playing = false; loadPattern(); state.pattern = PAT.map((l) => l.slice()); sDone = true; a.finish({ pattern: state.pattern }); },
  };

  return {
    pitch_cards: {
      start(params, a) { tableStart(a, 'pitch'); },
      update: tableUpdate, draw: tableDraw, end: tableEnd,
      autoplay(a) { // everyone collected, in notebook order
        const order = NAMES.filter((n) => n === 'Des' || n === 'Bernie' || n === 'Declan' || state.names.includes(n));
        state.flags.pitchOrder = order; done = true; a.finish({ order });
      },
    },
    journey: {
      start(params, a) { tableStart(a, 'journey'); },
      update: tableUpdate, draw: tableDraw, end: tableEnd,
      autoplay(a) { done = true; a.finish({ ok: true }); },
    },
    sequencer,
  };
})());

// ============================================================ MAIN
// boot(): loader (everything built, compiled and uploaded up front) -> "JARVIS is ready." -> prologue on first launch -> title.
// The loop: fixed 60 Hz ticks (input, menus, UI, updaters, world.update) + interpolated world.render every frame.

async function boot() {
  try {
    const s = JSON.parse(localStorage.getItem('rue.save'));
    if (s && s.options) Object.assign(options, s.options);
    if (s && s.profile) Object.assign(profile, s.profile);
  } catch (e) { /* storage blocked: defaults */ }
  document.body.classList.toggle('large', options.textSize === 'large');
  ui.init(); menus.init();
  on('scene:end', (e) => {
    const id = e && typeof e === 'object' ? e.id : e;
    if (TEST.auto && (id === TEST.stop || id === 'PC')) RUE_TEST.done = true;
  });
  const hasWorld = () => typeof world !== 'undefined' && world.set;

  // ---------------------------------------------------------- loop
  const step = CONFIG.step;
  let last = performance.now(), acc = 0;
  function tick() {
    input.tick();
    menus.update();
    if (clock.paused) return;
    ui.update(step);
    clock.step();
    if (hasWorld()) world.update(step);
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const ms = now - last;
    last = now;
    perf.frame(ms);
    input.poll();
    acc += Math.min(ms / 1000, CONFIG.maxFrame) * (TEST.auto ? Math.max(clock.scale, TEST.speed) : clock.scale);
    for (let n = 0; acc >= step && n < 12; n++) { tick(); acc -= step; }
    if (acc >= step) acc %= step; // more than 12 ticks behind: drop it rather than spiral
    renderer.info.reset();
    if (hasWorld()) world.render(acc / step);
    emit('render', acc / step);
    perf.draw();
  }
  requestAnimationFrame(frame);

  // ---------------------------------------------------------- loader
  const ld = document.getElementById('loader'), bar = ld.querySelector('.jv-prog i'), pct = ld.querySelector('.jv-prog span');
  const setP = (f) => { bar.style.transform = `scaleX(${f})`; pct.textContent = Math.round(f * 100) + '%'; };
  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));
  setP(0);

  // Build one character under the fixed light rig (hemi + dir + spot + FogExp2, same program family as the sets),
  // compile + upload it, and bake its dialogue portrait from a head-and-shoulders render of the real model.
  let warm = null;
  const warmCharacter = (id) => {
    if (!warm) {
      const sc = new THREE.Scene();
      sc.background = new THREE.Color(0x2c3868);
      sc.fog = new THREE.FogExp2(0x2c3868, 0.002);
      sc.add(new THREE.HemisphereLight(0xfff2e0, 0x404058, 1.4));
      const dl = new THREE.DirectionalLight(0xffffff, 1.7); dl.position.set(1.2, 2.5, 3); sc.add(dl);
      const sp = new THREE.SpotLight(0xffffff, 0); sc.add(sp, sp.target);
      warm = { sc, cam: new THREE.PerspectiveCamera(30, 1, 0.05, 30), v: new THREE.Vector3() };
    }
    const rig = buildCharacter(id), v = warm.v, c = warm.cam, gl = renderer.domElement;
    warm.sc.add(rig.root);
    if (rig.face && rig.face.set) rig.face.set('neutral');
    rig.root.updateMatrixWorld(true);
    if (typeof rig.eye === 'number') v.set(0, rig.eye - 0.04, 0); else { rig.parts.head.getWorldPosition(v); v.y += 0.08; }
    c.aspect = gl.width / gl.height; c.updateProjectionMatrix();
    c.position.set(v.x + 0.12, v.y + 0.05, v.z + 0.8); c.lookAt(v.x, v.y + 0.01, v.z);
    renderer.compile(warm.sc, c);
    renderer.render(warm.sc, c);
    const pc = document.createElement('canvas'), side = Math.min(gl.width, gl.height);
    pc.width = pc.height = 128;
    pc.getContext('2d').drawImage(gl, (gl.width - side) / 2, (gl.height - side) / 2, side, side, 0, 0, 128, 128); // same task as the render
    portraitURL.bake(id, pc);
    warm.sc.remove(rig.root);
  };
  const jobs = [];
  if (typeof AUDIO !== 'undefined') jobs.push(() => AUDIO.prerender());
  if (typeof world !== 'undefined') for (const id in SETS) jobs.push(() => world.warm(id));
  if (typeof buildCharacter === 'function') for (const id in LOOKS) if (LOOKS[id]) jobs.push(() => warmCharacter(id));
  await nextFrame();
  for (let i = 0; i < jobs.length; i++) {
    try { await jobs[i](); } catch (e) { console.error('RUE boot job failed', e); }
    setP((i + 1) / jobs.length);
    await nextFrame();
  }
  renderer.setRenderTarget(null); renderer.clear();
  perf.adapt = true;

  if (TEST.auto) {
    ld.classList.add('off');
    if (typeof AUDIO !== 'undefined') AUDIO.init();
    state = newState();
    RUE_TEST.ready = true;
    flow.start(TEST.scene || 'P', { select: !!TEST.scene });
    return;
  }

  // "JARVIS is ready. [YES]" — the first key/click unlocks audio inside the event itself
  ld.querySelector('.jv-msg').textContent = 'JARVIS is ready.';
  ld.querySelector('.jv-prog').classList.add('off');
  const yes = document.createElement('button');
  yes.className = 'jv-b foc'; yes.textContent = 'YES';
  ld.querySelector('.jv-btns').append(yes);
  input.gesture = () => { if (typeof AUDIO !== 'undefined') AUDIO.init(); };
  RUE_TEST.ready = true;
  await new Promise((res) => {
    const f = () => { if (input.pressed('yes')) { input.consume('yes'); done(); } };
    const done = () => { removeUpdate(f); yes.onclick = null; res(); };
    yes.onclick = done;
    addUpdate(f);
  });
  ui.sfx('chime_ready');
  ld.classList.add('off');
  if (!profile.seenPrologue) { state = newState(); flow.start('P'); } else menus.title();
}

boot();
</script></body></html>
