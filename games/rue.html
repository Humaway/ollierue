<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RUE</title>
<style>
:root {
  --navy: #141d3a; --yes: #ffd21f; --jv: #2f6fd6; --jvbar: #d9dce1;
  --game: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --sys: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "Courier New", ui-monospace, Menlo, Consolas, monospace;
  --ts: 22px;
}
body.large { --ts: 28px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: var(--game); color: #fff; }
#gl, #overlay { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
#overlay { pointer-events: none; z-index: 1; }
#ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#ui > * { position: absolute; }
.off { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; pointer-events: auto; border: 0; background: none; padding: 0; outline: none; }

/* layers */
#mg { inset: 0; z-index: 1; }
#mg > * { pointer-events: auto; }
#cardwrap { inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
#cardwrap canvas { filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
#fade, #flash { inset: 0; opacity: 0; background: #000; }
#flash { z-index: 9; background: #fff; }
#fade { z-index: 10; opacity: 1; }

/* letterbox 2.35:1 */
.lb { left: 0; right: 0; height: max(0px, calc((100vh - 100vw / 2.35) / 2)); background: #000; z-index: 6; transition: transform .4s ease-in-out; }
#lbt { top: 0; transform: translateY(-100%); }
#lbb { bottom: 0; transform: translateY(100%); }
#ui.lbon #lbt, #ui.lbon #lbb { transform: none; }

/* objective */
#obj { left: 18px; top: 16px; z-index: 3; max-width: 46vw; font-size: 16px; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,.6); transition: opacity .3s; }
#obj.hide { opacity: 0; }
#obj .line { display: flex; gap: 8px; align-items: baseline; }
#obj .line::before { content: ""; width: 4px; height: 15px; background: var(--yes); border-radius: 2px; flex: none; transform: translateY(2px); }
#obj .it { margin: 4px 0 0 12px; font-size: 15px; color: #e8ecf5; }
#obj .it::before { content: "\2610  "; color: #cfd6e6; }
#obj .it.done { color: #9aa3b8; text-decoration: line-through; text-decoration-color: rgba(255,210,31,.8); }
#obj .it.done::before { content: "\2611  "; color: var(--yes); }

/* 1987 HUD */
#hud { right: 18px; top: 14px; z-index: 3; display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 10px; border-radius: 10px;
  background: rgba(10,14,30,.55); font-size: 15px; font-weight: bold; letter-spacing: .04em; text-shadow: 0 1px 1px #000; }
#hud .bat { position: relative; width: 34px; height: 16px; border: 2px solid #fff; border-radius: 3px; }
#hud .bat::after { content: ""; position: absolute; right: -6px; top: 3px; width: 3px; height: 6px; background: #fff; border-radius: 0 2px 2px 0; }
#hud .bat i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 26px; background: #7fe07a; transform-origin: 0 50%; }
#hud.low .bat i { background: #ff4a3d; }
#hud .bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
#hud .bars i { width: 4px; background: rgba(255,255,255,.25); border-radius: 1px; }
#hud .bars i:nth-child(1) { height: 25%; } #hud .bars i:nth-child(2) { height: 50%; }
#hud .bars i:nth-child(3) { height: 75%; } #hud .bars i:nth-child(4) { height: 100%; }
#hud .bars i.on { background: #fff; }
#hud .ns { font-size: 13px; color: #ffb3a8; font-weight: normal; }

/* interaction prompt, toast, swap */
#prompt { left: 50%; bottom: 7vh; z-index: 3; transform: translateX(-50%); padding: 7px 16px 7px 8px; border-radius: 999px; white-space: nowrap;
  background: rgba(20,29,58,.82); border: 1px solid rgba(255,210,31,.55); font-size: 17px; }
#prompt b { display: inline-block; padding: 2px 9px; margin-right: 8px; border-radius: 999px; background: var(--yes); color: var(--navy); font-size: 14px; letter-spacing: .06em; }
#prompt b.no { background: #e8e8ee; }
#ui.talking #prompt { opacity: 0; }
#toast { right: 24px; bottom: 24px; z-index: 11; padding: 8px 18px; border-radius: 10px; background: rgba(20,29,58,.85); border-top: 2px solid var(--yes);
  font-size: 17px; opacity: 0; transition: opacity .35s; }
#toast.show { opacity: 1; }
#swap { left: 18px; bottom: 18px; z-index: 3; width: 96px; height: 84px; }
#swap img { position: absolute; border-radius: 10px; border: 2px solid rgba(255,255,255,.8); background: var(--navy); }
#swap .a { left: 0; bottom: 0; width: 64px; height: 64px; z-index: 2; border-color: var(--yes); }
#swap .b { left: 46px; bottom: 32px; width: 40px; height: 40px; opacity: .8; }
#swap span { position: absolute; left: 68px; bottom: 2px; font-size: 12px; font-weight: bold; color: var(--yes); text-shadow: 0 1px 2px #000; }

/* dialogue box */
#dlg { left: 10%; width: 80%; bottom: 3.5vh; z-index: 7; display: flex; gap: 16px; align-items: flex-start; min-height: 128px; padding: 16px 22px 18px 16px;
  background: rgba(20,29,58,.9); border-top: 3px solid var(--yes); border-radius: 16px; box-shadow: 0 4px 0 rgba(0,0,0,.25); pointer-events: auto; }
#dlg .face { flex: none; width: 96px; height: 96px; border-radius: 12px; background: #26325e; border: 2px solid rgba(255,255,255,.18); object-fit: cover; }
#dlg .col { flex: 1; min-width: 0; }
#dlg .who { height: 22px; margin: 0 0 6px; font-weight: bold; font-size: 17px; letter-spacing: .08em; color: var(--yes); white-space: nowrap; }
#dlg .who i { margin-left: 10px; font-style: normal; font-weight: normal; font-size: 13px; letter-spacing: .04em; color: #97a2c2; text-transform: lowercase; }
#dlg .txt { min-height: 2.6em; font-size: var(--ts); line-height: 1.34; white-space: pre-wrap; overflow-wrap: break-word; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
#dlg .more { position: absolute; right: 20px; bottom: 12px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
  border-top: 11px solid var(--yes); animation: bob .7s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(5px); } }
#dlg.noface .face { display: none; }
#dlg.noname .who { display: none; }
#dlg .opts { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
#dlg .opts button { text-align: left; padding: 5px 12px 5px 30px; border-radius: 8px; font-size: calc(var(--ts) * .9); position: relative; color: #e8ecf8; }
#dlg .opts button.sel { background: rgba(255,255,255,.1); color: #fff; }
#dlg .opts button.sel::before { content: "\25B6"; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--yes); }
#dlg .opts button.dis { color: #6d7695; }
#dlg .opts.ask { flex-direction: row; gap: 14px; }
#dlg .opts.ask button { padding: 6px 22px; border: 2px solid var(--yes); border-radius: 999px; font-weight: bold; letter-spacing: .08em; }
#dlg .opts.ask button:first-child { background: var(--yes); color: var(--navy); }
#dlg .opts.ask button.sel::before { content: none; }
#dlg .opts.ask button.dis { border-color: #4a5170; background: transparent; color: #6d7695; }

/* title and act cards */
#tcard, #acard { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; text-align: center; }
#tcard { z-index: 8; letter-spacing: .28em; font-size: 21px; text-transform: uppercase; text-shadow: 0 2px 6px #000, 0 0 18px rgba(0,0,0,.6); padding-left: .28em; }
#acard { z-index: 8; background: #000; }
#acard b { font-size: 46px; letter-spacing: .3em; padding-left: .3em; margin-bottom: 18px; }
#acard i { font-size: 22px; color: #d7dbe8; letter-spacing: .05em; }
#acard hr { width: 64px; border: 0; border-top: 3px solid var(--yes); margin: 0 0 18px; }

/* JARVIS pop-ups: tired corporate web app */
#pops { inset: 0; z-index: 5; }
.jvw { position: absolute; left: 0; top: 0; }
.jv { width: 340px; background: #fff; color: #2b2f36; font-family: var(--sys); font-size: 14px; line-height: 1.4; text-align: left;
  border: 1px solid #8e96a4; border-radius: 3px; box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 8px 16px rgba(0,0,0,.25); pointer-events: auto;
  animation: jvpop .16s ease-out; }
.jv.shake { animation: jvshake .42s ease-out; }
@keyframes jvpop { from { transform: scale(.86); opacity: 0; } }
@keyframes jvshake { 0% { transform: scale(.8); } 15% { transform: translateX(-12px) rotate(-1.5deg); } 30% { transform: translateX(11px) rotate(1deg); }
  45% { transform: translateX(-8px); } 60% { transform: translateX(6px); } 75% { transform: translateX(-3px); } 100% { transform: none; } }
.jv-bar { display: flex; align-items: center; gap: 8px; height: 28px; border-radius: 3px 3px 0 0; padding: 0 8px; background: linear-gradient(#e6e8ec, #d2d6dc); border-bottom: 1px solid #aab0ba; color: #4a505c; font-size: 12.5px; }
.jv-logo { display: flex; align-items: center; gap: 5px; font-weight: 800; font-style: italic; letter-spacing: .06em; color: var(--jv); font-size: 12px; }
.jv-logo::before { content: ""; width: 11px; height: 11px; border-radius: 2px; background: var(--jv); box-shadow: inset -3px -3px 0 #1d4fa8; }
.jv-t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.jv-x { color: #9aa0aa; font-style: normal; font-size: 15px; }
.jv-body { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px 10px; }
.jv-msg { flex: 1; white-space: pre-line; overflow-wrap: break-word; }
.ic { flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #fff; font-family: var(--sys); }
.ic.error { background: #d43a2f; border-radius: 50%; }
.ic.info { background: var(--jv); border-radius: 50%; font-family: Georgia, serif; font-style: italic; }
.ic.warn { background: #f2b51c; color: #2b2f36; clip-path: polygon(50% 2%, 100% 96%, 0 96%); padding-top: 7px; font-size: 16px; }
.ic.none { display: none; }
.jv-spin { width: 26px; height: 26px; margin: 2px auto 10px; border: 3px solid #d7dbe2; border-top-color: var(--jv); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.jv-prog { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; font-size: 12px; color: #6b717c; }
.jv-prog div { flex: 1; height: 12px; border: 1px solid #a9b0bb; background: #eef0f3; border-radius: 2px; overflow: hidden; }
.jv-prog i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, #4f8ae6 0 8px, #3a74d4 8px 16px); transform-origin: 0 50%; }
.jv-prog.anim i { animation: stripes .6s linear infinite; background-size: 22.6px 100%; }
@keyframes stripes { from { background-position: 0 0; } to { background-position: 22.6px 0; } }
.jv-btns { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 12px 12px; border-radius: 0 0 3px 3px; background: #f4f5f7; border-top: 1px solid #e1e4e8; }
.jv-btns:empty { display: none; }
.jv-b { min-width: 74px; padding: 5px 14px; border-radius: 3px; background: linear-gradient(#4b8cf0, var(--jv)); border: 1px solid #2459b3; color: #fff;
  font-family: var(--sys); font-size: 13.5px; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); transition: transform .12s; }
.jv-b.foc { outline: 2px solid #ffcf3a; outline-offset: 1px; }
.jv-b:active { background: #2459b3; }
.jv.big { width: 460px; font-size: 16px; }
.jv.crash .jv-body { background: #fff4f3; }

/* inventory */
#inv { left: 50%; bottom: 4vh; z-index: 12; transform: translateX(-50%); width: min(880px, 92vw); padding: 16px 20px 14px; border-radius: 16px;
  background: rgba(20,29,58,.94); border-top: 3px solid var(--yes); pointer-events: auto; }
#inv .hd { display: flex; justify-content: space-between; font-size: 13px; color: #97a2c2; letter-spacing: .1em; margin-bottom: 10px; }
#inv .row { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; }
#inv .slot { flex: none; width: 96px; text-align: center; padding: 6px 4px; border-radius: 10px; border: 2px solid transparent; }
#inv .slot canvas { width: 72px; height: 72px; display: block; margin: 0 auto 4px; border-radius: 8px; background: rgba(255,255,255,.06); }
#inv .slot span { display: block; font-size: 12.5px; line-height: 1.2; color: #dfe4f2; }
#inv .slot.sel { border-color: var(--yes); background: rgba(255,210,31,.1); }
#inv .slot.pick { border-color: #7fb4ff; }
#inv .desc { min-height: 1.4em; margin: 6px 0 10px; font-size: 17px; }
#inv .acts { display: flex; gap: 10px; }
#inv .acts button { padding: 6px 18px; border-radius: 999px; border: 2px solid rgba(255,210,31,.5); font-size: 15px; }
#inv .acts button.sel { background: var(--yes); color: var(--navy); border-color: var(--yes); }
#inv .acts.dim button { opacity: .35; }
#inv .empty { color: #97a2c2; padding: 18px 0; }

/* title screen and menus */
#title { inset: 0; z-index: 13; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,.7) 100%); }
#title .logo { font-size: min(26vh, 22vw); font-weight: bold; letter-spacing: .12em; margin-left: .12em; line-height: 1; color: #f4f1e8;
  text-shadow: 0 6px 24px rgba(0,0,0,.6); }
#title .rule { width: 18vh; height: 4px; margin: 2vh 0 4vh; background: var(--yes); border-radius: 2px; }
#title .press { font-size: 22px; font-weight: bold; letter-spacing: .3em; color: var(--yes); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
#title .disc { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12.5px; color: rgba(255,255,255,.55); letter-spacing: .03em; }
#title.withmenu .press { display: none; }
#title.withmenu { justify-content: flex-start; padding-top: 11vh; }
#title.withmenu .logo { font-size: min(18vh, 16vw); }
#menu { inset: 0; z-index: 14; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
#menu.dim { background: rgba(6,9,22,.72); }
#menu.low { align-items: flex-end; padding-bottom: 12vh; background: none; }
#menu .panel { min-width: 340px; max-width: min(760px, 94vw); max-height: 86vh; display: flex; flex-direction: column; padding: 18px 22px 14px;
  border-radius: 16px; background: rgba(20,29,58,.93); border-top: 3px solid var(--yes); }
#menu.low .panel { background: rgba(20,29,58,.72); min-width: 300px; }
#menu .head { font-weight: bold; letter-spacing: .2em; color: var(--yes); font-size: 15px; margin: 2px 0 12px 6px; }
#menu .head:empty { display: none; }
#menu .list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
#menu .list button { display: flex; justify-content: space-between; gap: 30px; text-align: left; padding: 8px 14px 8px 32px; border-radius: 9px; font-size: 19px;
  position: relative; color: #e2e7f4; white-space: nowrap; }
#menu .list button.sel { background: rgba(255,255,255,.1); color: #fff; }
#menu .list button.sel::before { content: "\25B6"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--yes); }
#menu .list button em { font-style: normal; color: var(--yes); letter-spacing: .04em; }
#menu .list button.dis { color: #6d7695; }
#menu .list button small { color: #8f9abb; font-size: 14px; }
#menu .body { overflow-y: auto; margin-bottom: 10px; font-size: 16px; line-height: 1.5; color: #dfe4f2; }
#menu .body:empty { display: none; }
#menu .body table { border-collapse: collapse; width: 100%; font-size: 15px; }
#menu .body td, #menu .body th { padding: 5px 12px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: left; }
#menu .body th { color: var(--yes); font-size: 13px; letter-spacing: .08em; }
#menu .body canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 60vh; }
#menu .body p { margin: 0 0 12px; text-align: center; }
#menu .body .cr b { color: var(--yes); letter-spacing: .12em; font-size: 13px; display: block; margin-top: 10px; }
#menu .foot { margin-top: 10px; font-size: 12.5px; color: #8f9abb; text-align: right; letter-spacing: .05em; }

/* loader */
#loader { inset: 0; z-index: 20; background: #000; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
#loader .jv { width: 380px; animation: none; }

/* touch controls */
#touch { inset: 0; z-index: 15; }
#touch > * { position: absolute; pointer-events: auto; touch-action: none; }
#stick { left: 26px; bottom: 26px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.25); }
#stick i { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(255,255,255,.35); }
.tb { width: 64px; height: 64px; border-radius: 50%; font-weight: bold; font-size: 14px; letter-spacing: .05em; background: rgba(20,29,58,.7); border: 2px solid rgba(255,255,255,.4); color: #fff; }
.tb.on { background: rgba(255,210,31,.6); }
#t-yes { right: 30px; bottom: 96px; width: 84px; height: 84px; background: rgba(255,210,31,.85); color: var(--navy); font-size: 17px; border-color: var(--yes); }
#t-no { right: 128px; bottom: 34px; }
#t-swap { right: 128px; bottom: 124px; font-size: 12px; }
#t-bag { right: 40px; bottom: 16px; width: 64px; height: 64px; font-size: 12px; }
#t-pause { right: 14px; top: 64px; width: 46px; height: 46px; font-size: 16px; }
#ui.touchui #dlg { left: 12px; width: calc(100% - 228px); bottom: 12px; }
#ui.touchui.talking #stick, #ui.touchui.talking #t-swap, #ui.touchui.talking #t-bag { opacity: 0; pointer-events: none; }

/* F2 overlay */
#perf { left: 8px; top: 48px; z-index: 30; padding: 6px; background: rgba(0,0,0,.72); border-radius: 6px; font: 11px/1.35 var(--mono); color: #cfe; }
#perf canvas { display: block; width: 240px; height: 64px; }
#perf pre { margin: 4px 0 0; white-space: pre-wrap; max-width: 240px; font: inherit; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>
<div id="ui">
  <div id="mg"></div>
  <div id="cardwrap" class="off"><canvas id="card"></canvas></div>
  <div id="obj" class="off"></div>
  <div id="hud" class="off"><div class="bat"><i></i></div><span class="pct">1%</span><div class="bars"><i></i><i></i><i></i><i></i></div><span class="ns">No Service</span></div>
  <div id="swap" class="off"><img class="b" alt=""><img class="a" alt=""><span>TAB</span></div>
  <div id="prompt" class="off"></div>
  <div id="pops"></div>
  <div id="lbt" class="lb"></div><div id="lbb" class="lb"></div>
  <div id="dlg" class="off"><img class="face" alt=""><div class="col"><div class="who"><span></span><i></i></div><div class="txt"></div><div class="opts"></div></div><div class="more off"></div></div>
  <div id="tcard"></div>
  <div id="acard"><b></b><hr><i></i></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="toast"></div>
  <div id="inv" class="off" data-noyes><div class="hd"><span>INVENTORY</span><span class="hint">YES — Select · NO — Close</span></div><div class="row"></div><div class="desc"></div><div class="acts"><button>Examine</button><button>Use</button><button>Combine</button></div></div>
  <div id="title" class="off"><div class="logo">RUE</div><div class="rule"></div><div class="press">PRESS YES</div><div class="disc">A work of affectionate parody. Not affiliated with or endorsed by Optus.</div></div>
  <div id="menu" class="off" data-noyes><div class="panel"><div class="head"></div><div class="body"></div><div class="list"></div><div class="foot">YES — Select · NO — Back</div></div></div>
  <div id="touch" class="off">
    <div id="stick"><i></i></div>
    <button class="tb" id="t-yes" data-a="yes">YES</button><button class="tb" id="t-no" data-a="no">NO</button>
    <button class="tb" id="t-swap" data-a="swap">SWAP</button><button class="tb" id="t-bag" data-a="inventory">BAG</button>
    <button class="tb" id="t-pause" data-a="pause">&#10074;&#10074;</button>
  </div>
  <div id="loader"><div class="jv"><div class="jv-bar"><span class="jv-logo">JARVIS</span><span class="jv-t"></span><i class="jv-x">&times;</i></div>
    <div class="jv-body"><div class="ic info">i</div><div class="jv-msg">JARVIS is loading your game.</div></div>
    <div class="jv-prog anim"><div><i></i></div><span>0%</span></div><div class="jv-btns"></div></div></div>
  <div id="perf" class="off"><canvas width="240" height="64"></canvas><pre></pre></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
// ============================================================ CONFIG

// ------------------------------------------------------------ event bus
const bus = {};
function on(name, fn) { (bus[name] ||= []).push(fn); }
function off(name, fn) { const l = bus[name]; if (l) { const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); } }
function emit(name, data) { const l = bus[name]; if (l) for (let i = 0; i < l.length; i++) l[i](data); }

// ------------------------------------------------------------ clock, updaters, waits
// clock.t only advances in fixed CONFIG.step ticks. clock.scale > 1 = extra ticks per frame (see boot()).
const clock = {
  t: 0, dt: CONFIG.step, frame: 0, scale: 1, paused: false,
  fns: [], waits: [], dirty: false,
  step() { // one fixed tick of game time: updaters + waits (world.update is called by the loop)
    const dt = CONFIG.step;
    clock.t += dt; clock.frame++;
    const fns = clock.fns;
    for (let i = 0; i < fns.length; i++) { const f = fns[i]; if (f) f(dt); }
    if (clock.dirty) { let j = 0; for (let i = 0; i < fns.length; i++) if (fns[i]) fns[j++] = fns[i]; fns.length = j; clock.dirty = false; }
    const w = clock.waits, skip = typeof flow !== 'undefined' && flow.skipping;
    let j = 0;
    for (let i = 0; i < w.length; i++) {
      const x = w[i];
      if (skip || (x.fn ? x.fn() : clock.t >= x.t)) x.res(); else w[j++] = x;
    }
    w.length = j;
  },
};
function addUpdate(fn) { if (!clock.fns.includes(fn)) clock.fns.push(fn); }
function removeUpdate(fn) { const i = clock.fns.indexOf(fn); if (i >= 0) { clock.fns[i] = null; clock.dirty = true; } }
function wait(sec) {
  if ((typeof flow !== 'undefined' && flow.skipping) || !(sec > 0)) return Promise.resolve();
  return new Promise((res) => clock.waits.push({ t: clock.t + sec, fn: null, res }));
}
function waitUntil(fn) {
  if (typeof flow !== 'undefined' && flow.skipping) return Promise.resolve();
  return new Promise((res) => clock.waits.push({ t: 0, fn, res })); // checked from the next tick on
}

// ------------------------------------------------------------ input
const input = (() => {
  const A = ['yes', 'no', 'swap', 'inventory', 'run', 'pause', 'up', 'down', 'left', 'right'];
  const DIRS = { up: 1, down: 1, left: 1, right: 1 }, PADA = Object.keys(CONFIG.pad);
  const kb = {}, pad = {}, tch = {}, ms = {}, hit = {}, rel = {}, prev = {}, pr = {}, re = {}, dn = {};
  const push = (a) => { hit[a] = (hit[a] || 0) + 1; }; // one queued press
  const codeTo = {}; // KeyboardEvent.code -> action
  for (const a in CONFIG.keys) for (const c of CONFIG.keys[a]) codeTo[c] = a;
  const keysDown = new Set();
  const touchDevice = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const touchEl = document.getElementById('touch'), stickEl = document.getElementById('stick'), knob = stickEl.firstElementChild;
  const stick = { id: -1, x: 0, y: 0, far: false, fx: 0, fy: 0 };
  const padAxes = { x: 0, y: 0, fx: 0, fy: 0 };
  let pads = 0, pPrev = {}, pPtr = false, rPtr = false;

  const I = {
    move: { x: 0, y: 0 }, run: false, scheme: touchDevice ? 'touch' : 'kb', lastKey: '',
    pointer: { x: innerWidth / 2, y: innerHeight / 2, down: false, pressed: false, released: false, over: null },
    gesture: null, // set by boot(): called synchronously inside the first key/pointer event (audio unlock)
    pressed: (a) => pr[a] === true,
    held: (a) => dn[a] === true,
    released: (a) => re[a] === true,
    consume(a) { pr[a] = false; },
    setScheme(s) {
      if (I.scheme === s) return;
      I.scheme = s;
      const on = s === 'touch' && touchDevice;
      touchEl.classList.toggle('off', !on); touchEl.parentNode.classList.toggle('touchui', on);
    },
    poll() { // once per frame: gamepads
      if (!pads || !navigator.getGamepads) return;
      const gp = navigator.getGamepads();
      let g = null;
      for (let i = 0; i < gp.length; i++) if (gp[i] && gp[i].connected) { g = gp[i]; break; }
      if (!g) return;
      let any = false;
      for (let i = 0; i < PADA.length; i++) {
        const a = PADA[i], b = g.buttons[CONFIG.pad[a]], d = !!(b && b.pressed);
        if (d && !pPrev[a]) { push(a); any = true; }
        pad[a] = d; pPrev[a] = d;
      }
      let x = g.axes[0] || 0, y = -(g.axes[1] || 0);
      const m = Math.hypot(x, y);
      if (m < 0.2) { x = 0; y = 0; } else { const k = Math.min(1, (m - 0.2) / 0.8) / m; x *= k; y *= k; any = true; }
      // stick flicks fire direction edges for menus and grids
      if (Math.abs(x) > 0.6 && Math.abs(padAxes.fx) < 0.35) push(x > 0 ? 'right' : 'left');
      if (Math.abs(y) > 0.6 && Math.abs(padAxes.fy) < 0.35) push(y > 0 ? 'up' : 'down');
      padAxes.x = padAxes.fx = x; padAxes.y = padAxes.fy = y;
      if (any) I.setScheme('pad');
    },
    tick() { // once per fixed tick: edges + move vector
      for (let i = 0; i < A.length; i++) {
        const a = A[i], d = !!(kb[a] || pad[a] || tch[a] || ms[a]);
        pr[a] = hit[a] > 0 || (d && !prev[a]);
        if (hit[a] > 0) hit[a]--; // presses queued within one frame come out on successive ticks
        re[a] = rel[a] === true || (!d && prev[a] === true);
        rel[a] = false; prev[a] = d; dn[a] = d;
      }
      const p = I.pointer;
      p.pressed = pPtr; p.released = rPtr; pPtr = rPtr = false;
      let x = (dn.right ? 1 : 0) - (dn.left ? 1 : 0), y = (dn.up ? 1 : 0) - (dn.down ? 1 : 0);
      if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }
      if (Math.abs(padAxes.x) + Math.abs(padAxes.y) > Math.abs(x) + Math.abs(y)) { x = padAxes.x; y = padAxes.y; }
      if (stick.id >= 0 && Math.abs(stick.x) + Math.abs(stick.y) > Math.abs(x) + Math.abs(y)) { x = stick.x; y = stick.y; }
      I.move.x = x; I.move.y = y;
      I.run = !!(dn.run || (stick.id >= 0 && stick.far));
    },
  };

  const gesture = () => { if (I.gesture) { const g = I.gesture; I.gesture = null; g(); } };
  const isField = (t) => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);

  addEventListener('keydown', (e) => {
    if (e.code === 'F2') { e.preventDefault(); perf.toggle(); return; }
    I.lastKey = e.key;
    if (!e.repeat) emit('key', e.code);
    if (isField(e.target)) return;
    const a = codeTo[e.code];
    if (!a) return;
    e.preventDefault();
    I.setScheme('kb');
    gesture();
    if (!e.repeat) { keysDown.add(e.code); kb[a] = true; push(a); } else if (DIRS[a]) push(a);
  });
  addEventListener('keyup', (e) => {
    keysDown.delete(e.code);
    const a = codeTo[e.code];
    if (!a) return;
    let d = false;
    for (const c of CONFIG.keys[a]) if (keysDown.has(c)) d = true;
    if (kb[a] && !d) rel[a] = true;
    kb[a] = d;
  });
  addEventListener('blur', () => { keysDown.clear(); for (const a of A) kb[a] = ms[a] = tch[a] = false; });

  addEventListener('pointerdown', (e) => {
    const p = I.pointer;
    p.x = e.clientX; p.y = e.clientY; p.down = true; p.over = e.target; pPtr = true;
    if (e.pointerType === 'touch') I.setScheme('touch'); else I.setScheme('kb');
    gesture();
    if (e.target.closest && e.target.closest('#touch')) return; // touch controls handle themselves
    if (e.button === 2) { ms.no = true; push('no'); return; }
    if (e.button === 0 && !(e.target.closest && e.target.closest('button, [data-noyes], input, textarea'))) { ms.yes = true; push('yes'); }
  });
  addEventListener('pointermove', (e) => { const p = I.pointer; p.x = e.clientX; p.y = e.clientY; p.over = e.target; });
  addEventListener('pointerup', (e) => {
    const p = I.pointer; p.x = e.clientX; p.y = e.clientY; p.down = false; rPtr = true;
    if (ms.yes) { ms.yes = false; rel.yes = true; }
    if (ms.no) { ms.no = false; rel.no = true; }
  });
  addEventListener('pointercancel', () => { I.pointer.down = false; ms.yes = ms.no = false; });
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('focusin', (e) => { if (e.target.tagName === 'BUTTON') e.target.blur(); }); // Enter/Space are YES, never a native click
  addEventListener('gamepadconnected', () => { pads++; });
  addEventListener('gamepaddisconnected', () => { pads = Math.max(0, pads - 1); });

  // touch buttons
  for (const b of touchEl.querySelectorAll('[data-a]')) {
    const a = b.dataset.a;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); tch[a] = true; push(a); b.classList.add('on'); });
    const up = () => { if (tch[a]) rel[a] = true; tch[a] = false; b.classList.remove('on'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  }
  // virtual stick: offset from the base centre / radius; beyond the rim = run
  const R = 60;
  const stickMove = (e) => {
    const r = stickEl.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    stick.far = d > R * 1.15;
    if (d > R) { dx *= R / d; dy *= R / d; }
    const x = dx / R, y = -dy / R, m = Math.hypot(x, y);
    stick.x = m < 0.15 ? 0 : x; stick.y = m < 0.15 ? 0 : y;
    if (Math.abs(x) > 0.6 && Math.abs(stick.fx) < 0.35) push(x > 0 ? 'right' : 'left');
    if (Math.abs(y) > 0.6 && Math.abs(stick.fy) < 0.35) push(y > 0 ? 'up' : 'down');
    stick.fx = x; stick.fy = y;
    knob.style.transform = `translate(${dx}px,${dy}px)`;
  };
  stickEl.addEventListener('pointerdown', (e) => { e.preventDefault(); stickEl.setPointerCapture(e.pointerId); stick.id = e.pointerId; stickMove(e); });
  stickEl.addEventListener('pointermove', (e) => { if (e.pointerId === stick.id) stickMove(e); });
  const stickUp = (e) => { if (e.pointerId !== stick.id) return; stick.id = -1; stick.x = stick.y = stick.fx = stick.fy = 0; stick.far = false; knob.style.transform = ''; };
  stickEl.addEventListener('pointerup', stickUp); stickEl.addEventListener('pointercancel', stickUp);

  if (touchDevice) { touchEl.classList.remove('off'); touchEl.parentNode.classList.add('touchui'); }
  return I;
})();

// ------------------------------------------------------------ saves (localStorage, always in try/catch)
function saveGame() {
  try { localStorage.setItem('rue.save', JSON.stringify({ state, options, profile })); return true; } catch (e) { return false; }
}
function loadGame() {
  try { const s = JSON.parse(localStorage.getItem('rue.save')); return (s && s.state) || null; } catch (e) { return null; }
}
function hasSave() { return !!loadGame(); }
function saveOptions() {
  try {
    let s = null;
    try { s = JSON.parse(localStorage.getItem('rue.save')); } catch (e) { s = null; }
    s = s || {}; s.options = options; s.profile = profile;
    localStorage.setItem('rue.save', JSON.stringify(s));
  } catch (e) { /* storage blocked: options live for this session only */ }
}

// ------------------------------------------------------------ perf: F2 overlay + adaptive pixel ratio
const perf = (() => {
  const N = 600, ft = new Float32Array(N); // ~10 s of frame times
  const el = document.getElementById('perf'), cv = el.querySelector('canvas'), cx = cv.getContext('2d'), pre = el.querySelector('pre');
  const touch = matchMedia('(pointer: coarse)').matches;
  const top = Math.min(devicePixelRatio || 1, touch ? 1.5 : 2);
  const levels = [2, 1.5, 1].filter((v) => v <= top);
  if (!levels.length || levels[0] !== top) levels.unshift(top);
  let i = 0, on = false, n = 0, lvl = 0, winT = 0, winN = 0, good = 0;
  const P = {
    adapt: false,
    toggle() { on = !on; el.classList.toggle('off', !on); },
    frame(ms) {
      ft[i] = ms; i = (i + 1) % N;
      if (!P.adapt) return;
      winT += Math.min(ms, 50); winN++; // one hitch (tab switch, GC) shouldn't drop the resolution
      if (winT < 2000) return;
      const avg = winT / winN; winT = 0; winN = 0;

// ============================================================ ART
// Canvas textures, the material library, static geometry (Builder), instancing, blob
// shadows, GPU rain, and the character rig (buildCharacter + LOOKS + ANIMS).
// Look: clean faceted low-poly. Everything is MeshLambertMaterial, flatShading, vertexColors
// (one program family); light is baked into vertex colours so sets read under hemi+dir.

// ------------------------------------------------------------ textures & materials
// canvasTex(w, h, paint(ctx,w,h), {repeat:[x,y], key}) -> sRGB CanvasTexture, smooth + mipmapped.
const canvasTex = (() => {
  const cache = new Map();
  return (w, h, paint, o = {}) => {
    if (o.key && cache.has(o.key)) return cache.get(o.key);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    paint(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
    if (o.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.repeat[0], o.repeat[1]); }
    if (o.key) cache.set(o.key, t);
    return t;
  };
})();

// mat(color, {emissive, emissiveIntensity, transparent, opacity, side, map, depthWrite, key}) -> cached
// MeshLambertMaterial. Shared: never animate a cached one unless you passed a unique `key`.
// With both `map` and `emissive`, the map is also the emissive map (self-lit screens: matTex(t, {emissive: 0xffffff})).
// Geometry without a colour attribute renders as if its vertex colour were white.
const mat = (() => {
  const cache = new Map();
  return (color = 0xffffff, o = {}) => {
    const c = new THREE.Color(color);
    const key = [c.getHexString(), o.emissive, o.emissiveIntensity, !!o.transparent, o.opacity ?? 1, o.side ?? 0,
      o.map ? o.map.uuid : '', o.depthWrite, o.key].join('|');
    let m = cache.get(key);
    if (m) return m;
    m = new THREE.MeshLambertMaterial({ color: c, flatShading: true, vertexColors: true, map: o.map || null,
      transparent: !!o.transparent, opacity: o.opacity ?? 1, side: o.side ?? THREE.FrontSide });
    if (o.transparent) m.depthWrite = o.depthWrite ?? false;
    if (o.emissive != null) { m.emissive.set(o.emissive); m.emissiveIntensity = o.emissiveIntensity ?? 1; if (o.map) m.emissiveMap = o.map; }
    m.defaultAttributeValues = { color: [1, 1, 1] };
    cache.set(key, m);
    return m;
  };
})();
const matTex = (tex, o = {}) => mat(o.color ?? 0xffffff, { ...o, map: tex });

// bakeLight(geometry, {dir, ambient, floor=true, y0}) writes (or multiplies into) a colour attribute:
// lambert from a fixed key direction, darker undersides, and (floor) an AO gradient that darkens
// walls/props toward the floor height y0 (default 0; instanced() uses the geometry's lowest point).
function bakeLight(g, o = {}) {
  const d = new THREE.Vector3(...(o.dir || [0.45, 0.8, 0.35])).normalize();
  const amb = o.ambient ?? 0.72, floor = o.floor !== false;
  const y0 = o.y0 ?? 0;

  const p = g.attributes.position, n = g.attributes.normal, old = g.attributes.color;
  const col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const nx = n.getX(i), ny = n.getY(i), nz = n.getZ(i);
    let c = amb + (1 - amb) * Math.max(0, nx * d.x + ny * d.y + nz * d.z);
    if (ny < -0.5) c *= 0.82;

    for (let k = 0; k < 3; k++) col[i * 3 + k] = c * (old ? old.getComponent(i, k) : 1);

}

// ------------------------------------------------------------ Builder
// Static set geometry, merged per material. Positions are CENTRES (like a Mesh at that position).
//   b.box(w,h,d, m, [x,y,z], rotY)   b.cyl(rTop,rBot,h,seg, m, [x,y,z], rotY)
//   b.plane(w,h, m, [x,y,z], [rx,ry,rz])  (faces +Z before rotation)   b.geo(geometry, m, Matrix4|[x,y,z])
//   b.done({dir, ambient, floor}) -> Group with one baked mesh per material. Builders are single-use.
class Builder {
  constructor() { this.list = new Map(); }

  box(w, h, d, m, p = [0, 0, 0], rotY = 0) {
    const g = new THREE.BoxGeometry(w, h, d); if (rotY) g.rotateY(rotY);
    return this.add(g.translate(p[0], p[1], p[2]), m);

  cyl(rt, rb, h, seg = 8, m, p = [0, 0, 0], rotY = 0) {
    const g = new THREE.CylinderGeometry(rt, rb, h, seg); if (rotY) g.rotateY(rotY);
    return this.add(g.translate(p[0], p[1], p[2]), m);
  }
  plane(w, h, m, p = [0, 0, 0], r) {
    const g = new THREE.PlaneGeometry(w, h);

    return this.add(g.translate(p[0], p[1], p[2]), m);
  }
  geo(geometry, m, at = [0, 0, 0]) {
    const g = geometry.clone();
    if (at.isMatrix4) g.applyMatrix4(at); else g.translate(at[0], at[1], at[2]);
    return this.add(g, m);
  }
  done(o = {}) {
    const group = new THREE.Group();
    for (const [m, gs] of this.list) {
      const anyCol = gs.some((g) => g.attributes.color);
      const parts = gs.map((g0) => {
        const g = g0.index ? g0.toNonIndexed() : g0;
        if (!g.attributes.normal) g.computeVertexNormals();
        if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
        if (anyCol && !g.attributes.color) g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 3).fill(1), 3));
        for (const k of Object.keys(g.attributes)) if (!/^(position|normal|uv|color)$/.test(k)) g.deleteAttribute(k);
        g.morphAttributes = {};
        return g;
      });
      const merged = mergeGeometries(parts);
      for (const g of gs) g.dispose();
      for (const g of parts) g.dispose();
      bakeLight(merged, o);
      group.add(new THREE.Mesh(merged, m));
    }
    this.list.clear();
    return group;
  }
}

// instanced(geometry, material, [[x,y,z,rotY,scale|[sx,sy,sz]], ...]) -> InstancedMesh.
// Bakes light into the geometry once if it has no colour attribute (local y = height).
function instanced(g, m, list) {
  if (!g.attributes.color) { g.computeBoundingBox(); bakeLight(g, { y0: g.boundingBox.min.y }); }

  const q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3(), mx = new THREE.Matrix4(), up = new THREE.Vector3(0, 1, 0);
  list.forEach((t, i) => {

    im.setMatrixAt(i, mx.compose(p.set(t[0], t[1], t[2]), q.setFromAxisAngle(up, t[3] || 0), s));

// blobShadow() -> small flat Mesh (shared geometry + one shared transparent material). Parent it under an actor.
const blobShadow = (() => {
  let geo, material;
  return () => {
    if (!geo) {
      geo = new THREE.PlaneGeometry(0.8, 0.8).rotateX(-Math.PI / 2);
      const tex = canvasTex(128, 128, (c, w, h) => {
        const gr = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');

// makeRain({box:[minX,minZ,maxX,maxZ], top=10, count=2500, bottom=0}) -> Points. Drops fall in the vertex
// shader: set rain.uniforms.uTime.value (seconds) and rain.uniforms.uAmount.value (0..1) — also on material.uniforms.
function makeRain({ box = [-10, -10, 10, 10], top = 10, count = 2500, bottom = 0 } = {}) {
  const pos = new Float32Array(count * 3), rnd = new Float32Array(count * 2);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = box[0] + Math.random() * (box[2] - box[0]);
    pos[i * 3 + 1] = bottom + Math.random() * (top - bottom);
    pos[i * 3 + 2] = box[1] + Math.random() * (box[3] - box[1]);

    vertexShader: `
      uniform float uTime, uAmount, uTop, uBottom;
      attribute vec2 aRnd;
      varying float vA; varying float vSize;
      #include <fog_pars_vertex>

        gl_Position = projectionMatrix * mvPosition;

        float a = (1.0 - smoothstep(w * 0.5, w, abs(c.x - c.y * 0.08))) * (1.0 - smoothstep(0.25, 0.5, abs(c.y)));
        if (a * vA < 0.02) discard;
        gl_FragColor = vec4(uColor, a * 0.5 * vA);

}

  fadeEl._o = 1; flashEl._o = 0; tcard._o = 0; acard._o = 0;

  // opacity tween on game time; a new tween on the same element replaces (and resolves) the old one
  function fadeTo(el, to, dur) {

  const inv = { el: $('inv'), row: null, desc: null, acts: null, slots: [], spec: null, sel: 0, mode: 'items', act: 0, first: -1, t: 0 };
  inv.row = inv.el.querySelector('.row'); inv.desc = inv.el.querySelector('.desc'); inv.acts = [...inv.el.querySelectorAll('.acts button')];

  const U = {
    skipping: () => typeof flow !== 'undefined' && flow.skipping === true,
    sfx(name, o) { if (typeof sfx === 'function') sfx(name, o); },

    fade(to, dur = 0.5, color) {
      if (to === 'out') to = 1; else if (to === 'in') to = 0;
      if (color) fadeEl.style.background = color; else if (to > 0) fadeEl.style.background = '#000';
      return fadeTo(fadeEl, to, dur);
    },
    flash(dur = 0.6, color = '#fff') {
      flashEl.style.background = color;
      if (U.skipping()) return fadeTo(flashEl, 0, 0);
      if (options.reduceFlashing) return fadeTo(flashEl, 0.35, dur * 0.4).then(() => fadeTo(flashEl, 0, dur * 1.2));
      flashEl._o = 1; flashEl.style.opacity = 1;

    },
    letterbox(on) { root.classList.toggle('lbon', !!on); },
    async title(text, dur = 2.5) {
      if (U.skipping()) return;
      tcard.textContent = text;
      await fadeTo(tcard, 1, 0.5); await wait(Math.max(0, dur - 1)); await fadeTo(tcard, 0, 0.5);
    },
    async actCard(text) {
      if (U.skipping()) return;
      const i = text.indexOf(' — ');
      acard.children[0].textContent = i < 0 ? text : text.slice(0, i);
      acard.children[2].textContent = i < 0 ? '' : text.slice(i + 3);
      await fadeTo(acard, 1, 0.8); await wait(2.8); await fadeTo(acard, 0, 0.8);
    },

    // paints CARDS[kind] into any canvas at the painter's native size; returns [w, h] or null
    paintCard(cv, kind, data) {
      const f = CARDS[kind];
      if (!f) { console.warn('RUE: no CARDS.' + kind); return null; }
      const s = f.size || [800, 600];
      if (cv.width !== s[0]) cv.width = s[0];
      if (cv.height !== s[1]) cv.height = s[1];
      const cx = cv.getContext('2d');
      cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, s[0], s[1]);

    },
    card(kind, data) {
      if (!kind) { cardWrap.classList.add('off'); return; }
      const s = U.paintCard(cardCv, kind, data);
      if (!s) return;
      const k = Math.min((root.classList.contains('lbon') ? 0.62 : 0.7) * innerHeight / s[1], 0.86 * innerWidth / s[0]); // stays inside the 2.35:1 frame
      cardCv.style.width = Math.round(s[0] * k) + 'px'; cardCv.style.height = Math.round(s[1] * k) + 'px';

    },
    toast(text) { toastEl.textContent = text; toastEl.classList.add('show'); toastT = 2.2; },
    prompt(text) {
      if (text === lastPrompt) return;
      lastPrompt = text;
      if (!text) { promptEl.classList.add('off'); return; }
      const m = /^(YES|NO)\b\s*(?:—\s*)?(.*)$/.exec(text);
      pB.textContent = m ? m[1] : ''; pB.className = m && m[1] === 'NO' ? 'no' : ''; pB.style.display = m ? '' : 'none';
      pS.textContent = m ? m[2] : text;
      promptEl.classList.remove('off');
    },
    swapIndicator(activeId, otherId) {
      if (!activeId) { swapEl.classList.add('off'); return; }
      swapEl.children[1].src = portraitURL(activeId);
      swapEl.children[0].src = otherId ? portraitURL(otherId) : '';
      swapEl.children[0].style.display = otherId ? '' : 'none';
      swapEl.classList.remove('off');
    },

    // ---------------------------------------------------------- inventory panel (modal while open)
    inventoryPanel(spec) {
      if (!spec) { inv.spec = null; inv.el.classList.add('off'); return null; }
      inv.spec = spec; inv.sel = 0; inv.mode = 'items'; inv.act = 0; inv.first = -1; inv.t = 0;
      const items = spec.items || [];
      inv.row.textContent = '';
      for (let k = 0; k < items.length; k++) {
        let s = inv.slots[k];
        if (!s) {
          s = document.createElement('div'); s.className = 'slot'; s._k = k;
          const c = document.createElement('canvas'); c.width = c.height = 96;
          s.append(c, document.createElement('span'));
          s.addEventListener('click', () => {
            if (!inv.spec) return;
            if (inv.mode === 'combine') { if (s._k !== inv.first) { inv.sel = s._k; invDo(); } return; }
            inv.sel = s._k; inv.mode = 'acts'; invPaint();
          });
          inv.slots[k] = s;
        }
        const it = items[k], cx = s.firstChild.getContext('2d');
        cx.clearRect(0, 0, 96, 96);
        const icon = it.icon || (ITEMS[it.id] && ITEMS[it.id].icon);
        if (typeof icon === 'function') { cx.save(); icon(cx, 96, 96); cx.restore(); }
        else { // generic glyph: a tag with the initial
          cx.fillStyle = '#3a4a86'; cx.beginPath(); cx.roundRect(14, 14, 68, 68, 12); cx.fill();
          cx.fillStyle = '#ffd21f'; cx.font = 'bold 38px "Trebuchet MS", sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
          cx.fillText((it.name || it.id || '?')[0].toUpperCase(), 48, 50);
        }
        s.lastChild.textContent = it.name || (ITEMS[it.id] && ITEMS[it.id].name) || it.id;
        inv.row.append(s);
      }
      if (!items.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing in your pockets.'; inv.row.append(e); }
      inv.el.classList.remove('off');

      return { close: () => { if (inv.spec === spec) U.inventoryPanel(null); } };
    },

    reset() { // back to a clean screen (title, quit)
      popup.clear(); U.card(null); U.prompt(null); objective(null); say.reset(); U.letterbox(false);
      U.swapIndicator(null); U.inventoryPanel(null); document.getElementById('hud').classList.add('off');
      fadeTo(flashEl, 0, 0); fadeTo(tcard, 0, 0); fadeTo(acard, 0, 0);
    },
    init() { on('render', popup.render); },

    update(dt) {
      for (let i = tweens.length - 1; i >= 0; i--) {
        const w = tweens[i];
        w.t += dt;
        const k = Math.min(1, w.t / w.dur);
        w.el._o = w.a + (w.b - w.a) * k; w.el.style.opacity = w.el._o;
        if (k >= 1) { tweens.splice(i, 1); w.res(); }
      }
      if (toastT > 0 && (toastT -= dt) <= 0) toastEl.classList.remove('show');
      objective.update();
      hud.update(dt);
      if (inv.spec) { invUpdate(dt); return; }
      say.update(dt);
      popup.update(dt);
    },
  };

  function invPaint() {
    const items = inv.spec.items || [], it = items[inv.sel];
    for (let k = 0; k < items.length; k++) {
      inv.slots[k].classList.toggle('sel', k === inv.sel);
      inv.slots[k].classList.toggle('pick', k === inv.first && inv.mode === 'combine');
    }
    for (let k = 0; k < 3; k++) inv.acts[k].classList.toggle('sel', inv.mode === 'acts' && k === inv.act);
    inv.acts[0].parentNode.classList.toggle('dim', inv.mode !== 'acts');
    if (!it) { inv.desc.textContent = ''; return; }
    const def = ITEMS[it.id] || {};
    inv.desc.textContent = inv.mode === 'combine' ? `Combine ${items[inv.first].name} with… ${inv.first === inv.sel ? '' : it.name}` : (def.desc || it.name);
  }
  function invDo() {
    const s = inv.spec, items = s.items, id = items[inv.sel] && items[inv.sel].id;
    if (inv.mode === 'combine') { const a = items[inv.first].id; U.inventoryPanel(null); s.onCombine && s.onCombine(a, id); return; }
    if (!id) return;
    if (inv.act === 2) { if (items.length < 2) { U.sfx('clunk'); return; } inv.mode = 'combine'; inv.first = inv.sel; inv.sel = (inv.sel + 1) % items.length; invPaint(); return; }
    U.inventoryPanel(null);
    if (inv.act === 0) s.onExamine && s.onExamine(id); else s.onUse && s.onUse(id);
  }
  inv.acts.forEach((b, k) => b.addEventListener('click', () => { if (!inv.spec || !(inv.spec.items || []).length) return; if (inv.mode === 'combine') inv.mode = 'acts'; inv.act = k; invDo(); }));
  function invUpdate(dt) {
    const s = inv.spec, n = (s.items || []).length;
    const close = () => { U.inventoryPanel(null); s.onClose && s.onClose(); };
    if (TEST.auto && (inv.t += dt) > 0.5) return close();
    const L = input.pressed('left') || input.pressed('up'), R = input.pressed('right') || input.pressed('down');
    input.consume('left'); input.consume('right'); input.consume('up'); input.consume('down');
    if (input.pressed('inventory')) { input.consume('inventory'); return close(); }
    let changed = L || R;
    if (inv.mode === 'acts') {
      if (L) inv.act = (inv.act + 2) % 3; if (R) inv.act = (inv.act + 1) % 3;

    }

      input.consume('yes'); changed = true;
      if (inv.mode === 'items') { if (n) inv.mode = 'acts'; } else if (inv.mode === 'acts' || inv.sel !== inv.first) { invDo(); if (!inv.spec) return; }
    } else if (input.pressed('no')) {
      input.consume('no'); changed = true;
      if (inv.mode === 'items') return close();
      if (inv.mode === 'combine') { inv.mode = 'acts'; inv.sel = inv.first; } else inv.mode = 'items';
    }
    if (changed) invPaint();
  }
  return U;
})();

// ------------------------------------------------------------ dialogue: say / choose / ask
const { say, choose, ask } = (() => {
  const box = document.getElementById('dlg'), face = box.querySelector('.face'), nameEl = box.querySelector('.who span'), tagEl = box.querySelector('.who i');
  const txt = box.querySelector('.txt'), optsEl = box.querySelector('.opts'), more = box.querySelector('.more');
  const node = document.createTextNode(''); txt.append(node);
  const btns = [];
  const D = { mode: null, res: null, id: '', faceId: null, text: '', len: 0, i: 0, acc: 0, cps: 48, beats: [], bi: 0, pause: 0, typing: false,
    n: 0, fast: false, q: false, censor: false, cwait: false, auto: 0, after: 0, talk: [], sel: 0, n2: 0, dis: [], opt: null, shown: false, hide: 0 };

  const talk = (on) => { if (typeof world !== 'undefined' && world.talk) for (let k = 0; k < D.talk.length; k++) world.talk(D.talk[k], on); };
  const blip = (rising) => { if (typeof AUDIO !== 'undefined') AUDIO.blip(D.id, rising); };
  function showBox() {
    D.hide = 0;
    if (D.shown) return;
    D.shown = true; box.classList.remove('off'); box.parentNode.classList.add('talking');
    if (typeof AUDIO !== 'undefined') AUDIO.duck(true);
  }
  function hideBox() {
    if (!D.shown) return;
    D.shown = false; box.classList.add('off'); box.parentNode.classList.remove('talking'); optsEl.classList.add('off'); more.classList.add('off');
    if (typeof AUDIO !== 'undefined') AUDIO.duck(false);
  }
  function finish(v) { // resolve the current request; the box lingers a few ticks in case another line follows
    const r = D.res; D.mode = null; D.res = null; D.hide = 0; D.cwait = false;
    more.classList.add('off'); optsEl.classList.add('off');
    if (r) r(v);
  }
  function header(id, opts) {
    const ch = CHARACTERS[id];
    nameEl.textContent = opts.name || (ch && ch.name) || String(id).toUpperCase();
    tagEl.textContent = opts.tag || '';
    box.classList.remove('noname');
    if (opts.portrait === false) box.classList.add('noface');
    else { box.classList.remove('noface'); if (D.faceId !== id) { face.src = portraitURL(id); D.faceId = id; } }
  }
  function opts(labels, askMode, dis) {
    optsEl.classList.toggle('ask', askMode);
    optsEl.textContent = '';
    for (let k = 0; k < labels.length; k++) {
      let b = btns[k];
      if (!b) {
        b = btns[k] = document.createElement('button'); b._k = k;
        b.addEventListener('click', () => { if (D.mode === 'choose') pick(b._k); else if (D.mode === 'ask') answer(b._k === 0); });
        b.addEventListener('pointerenter', () => { if (D.mode === 'choose') { D.sel = b._k; mark(); } });
      }
      b.textContent = labels[k];
      b.classList.toggle('dis', dis.includes(k));
      optsEl.append(b);
    }
    D.n2 = labels.length;
    optsEl.classList.remove('off');
    mark();
  }
  const mark = () => { for (let k = 0; k < D.n2; k++) btns[k].classList.toggle('sel', D.mode === 'choose' && k === D.sel); };

  function say(id, text, o = {}) {
    if (ui.skipping()) return Promise.resolve();
    text = String(text ?? '');
    if (D.res) finish();
    return new Promise((res) => {
      showBox(); header(id, o);
      // '^' = a beat: pause CONFIG.beat there, render nothing, collapse the doubled space
      let out = ''; const beats = [];
      for (let k = 0; k < text.length; k++) {
        const c = text[k];
        if (c === '^') { if (text[k + 1] === ' ' && (out === '' || out.endsWith(' '))) k++; beats.push(out.length); continue; }
        out += c;
      }
      const sp = o.speed || 'normal';
      Object.assign(D, { mode: 'say', res, id, text: out, beats, bi: 0, i: 0, acc: 0, pause: 0, typing: true, n: 0, after: 0, cwait: false,
        cps: CONFIG.text[sp] * CONFIG.text[options.textSpeed] / CONFIG.text.normal, fast: sp === 'fast' || options.textSpeed === 'fast',
        q: /\?[\s…—"')]*$/.test(out), censor: !!o.censor, auto: o.auto || 0 });
      D.len = D.censor ? Math.max(1, Math.floor(out.length * 0.75)) : out.length;
      const ch = CHARACTERS[id];
      D.talk = ch && ch.voice && ch.voice.also ? id.split('_') : [id];
      node.data = ''; optsEl.classList.add('off'); more.classList.add('off');
      talk(true);
    });
  }
  function typed() {
    D.typing = false; talk(false); D.after = 0;
    if (!D.censor) { more.classList.remove('off'); return; }
    // the swearing censor: JARVIS slams a pop-up over the speaker's face
    state.flags.seen_swearing = true;
    const who = D.talk[0], hasActor = typeof world !== 'undefined' && world.actor && world.actor(who);
    const p = popup({ msg: 'Language detected. This interaction has been flagged for coaching.', icon: 'warn', buttons: ['OK'], at: hasActor ? { actor: who } : 'center', shake: true });
    D.cwait = true;
    const res = D.res, done = () => { if (D.res === res && D.cwait) finish(); };
    p.done.then(done);
    if (typeof cam !== 'undefined' && cam.cutscene) wait(1.2).then(done);
  }
  function step(dt) { // typewriter: appends to one text node
    if (D.pause > 0) { if ((D.pause -= dt) <= 0) talk(true); return; }
    D.acc += dt * D.cps;
    while (D.acc >= 1 && D.i < D.len) {
      if (D.bi < D.beats.length && D.beats[D.bi] === D.i) { D.bi++; D.pause = CONFIG.beat; D.acc = 0; talk(false); return; }
      const c = D.text.charCodeAt(D.i);
      node.appendData(D.text[D.i]); D.i++; D.acc -= 1;
      const letter = (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || (c >= 192 && c < 0x2000);
      if (letter && (!D.fast || (D.n++ & 1) === 0)) blip(D.q && D.i > D.len - 6);
    }
    if (D.i >= D.len) typed();
  }
  function pick(k) {
    if (D.dis.includes(k)) { ui.sfx('clunk'); return; }
    finish(k);
  }
  function answer(v) {
    if ((v && D.opt.yesDisabled) || (!v && D.opt.noDisabled)) { ui.sfx('clunk'); return; }
    finish(v);
  }
  const autoPick = () => { const t = D.opt.test; if (t != null && !D.dis.includes(t)) return t; for (let k = 0; k < D.n2; k++) if (!D.dis.includes(k)) return k; return 0; };
  const autoAnswer = () => { let v = D.opt.test ?? true; if (v && D.opt.yesDisabled) v = false; else if (!v && D.opt.noDisabled) v = true; return v; };

  function choose(labels, o = {}) {
    if (D.res) finish();
    D.opt = o; D.dis = o.disabled || []; D.n2 = labels.length;
    if (ui.skipping()) return Promise.resolve(autoPick());
    return new Promise((res) => {
      if (!D.shown) { node.data = ''; box.classList.add('noname', 'noface'); D.faceId = null; }
      showBox(); more.classList.add('off');
      D.mode = 'choose'; D.res = res; D.after = 0;
      D.sel = 0; while (D.sel < labels.length - 1 && D.dis.includes(D.sel)) D.sel++;

    });
  }
  function ask(question, o = {}) {
    if (D.res) finish();
    D.opt = o; D.dis = []; D.n2 = 2;
    if (ui.skipping()) return Promise.resolve(autoAnswer());
    return new Promise((res) => {
      showBox(); more.classList.add('off');
      box.classList.add('noname', 'noface'); D.faceId = null;
      node.data = question;
      D.mode = 'ask'; D.res = res; D.after = 0;
      const dis = []; if (o.yesDisabled) dis.push(0); if (o.noDisabled) dis.push(1);
      opts(['YES', 'NO'], true, dis);
    });
  }

  say.busy = () => D.mode !== null && !D.cwait;
  say.reset = () => { D.mode = null; D.res = null; D.cwait = false; talk(false); hideBox(); };
  say.update = (dt) => {
    if (D.mode === null) { if (D.shown && (D.hide += dt) > 0.07) hideBox(); return; }
    const skip = ui.skipping();
    if (D.mode === 'say') {
      if (skip) { talk(false); return finish(); }
      if (D.typing) {
        if (input.pressed('yes')) { input.consume('yes'); node.data = D.text.slice(0, D.len); D.i = D.len; D.bi = D.beats.length; D.pause = 0; typed(); }
        else step(dt);
        return;
      }
      if (D.cwait) return; // the censor pop-up owns YES now
      D.after += dt;
      if ((D.auto > 0 && D.after >= D.auto) || (TEST.auto && D.after >= 0.15)) return finish();
      if (input.pressed('yes')) { input.consume('yes'); finish(); }
      return;
    }
    D.after += dt;
    if (D.mode === 'choose') {
      if (skip || (TEST.auto && D.after >= 0.3)) return finish(autoPick());
      if (input.pressed('up')) { input.consume('up'); D.sel = (D.sel - 1 + D.n2) % D.n2; mark(); }
      if (input.pressed('down')) { input.consume('down'); D.sel = (D.sel + 1) % D.n2; mark(); }
      if (input.pressed('yes')) { input.consume('yes'); pick(D.sel); }
    } else if (D.mode === 'ask') {
      if (skip || (TEST.auto && D.after >= 0.3)) return finish(autoAnswer());
      if (input.pressed('yes')) { input.consume('yes'); answer(true); }
      else if (input.pressed('no')) { input.consume('no'); answer(false); }
    }
  };
  return { say, choose, ask };
})();

// ------------------------------------------------------------ JARVIS pop-ups (pooled DOM)
const popup = (() => {
  const layer = document.getElementById('pops');
  const pool = [], live = [], v3 = new THREE.Vector3();
  let seq = 0;
  const HTML = '<div class="jv"><div class="jv-bar"><span class="jv-logo">JARVIS</span><span class="jv-t"></span><i class="jv-x">&times;</i></div>' +
    '<div class="jv-body"><div class="ic"></div><div class="jv-msg"></div></div><div class="jv-spin"></div>' +
    '<div class="jv-prog"><div><i></i></div><span></span></div><div class="jv-btns"></div></div>';

  function make() {
    const w = document.createElement('div'); w.className = 'jvw off'; w.innerHTML = HTML;
    const q = (s) => w.querySelector(s);
    const p = { w, box: w.firstChild, title: q('.jv-t'), ic: q('.ic'), msg: q('.jv-msg'), spin: q('.jv-spin'), prog: q('.jv-prog'), bar: q('.jv-prog i'),
      pct: q('.jv-prog span'), btns: q('.jv-btns'), bs: [], open: false, tok: 0, spec: null, res: null, age: 0, life: 0, n: 0, focus: 0, tickT: 0,
      pr: null, prT: 0, actor: null, stack: false, z: 0 };
    layer.append(w);
    return p;
  }
  function button(p, k) {
    let b = p.bs[k];
    if (b) return b;
    b = p.bs[k] = document.createElement('button'); b.className = 'jv-b'; b._k = k;
    b.addEventListener('click', () => { if (p.open) close(p, b._k); });
    b.addEventListener('pointerenter', (e) => {
      if (!p.open) return;
      focus(p, b._k);
      if (!p.spec.dodge || !p.spec.dodge.includes(b._k) || b._d >= 2) return;
      b._d++; // run away 60 px from the pointer (twice), then give up
      const r = b.getBoundingClientRect();
      let dx = e.clientX < r.left + r.width / 2 ? 60 : -60;
      if (Math.abs(b._x + dx) > 130) dx = -dx;
      b._x += dx; b._y = b._d === 1 ? -14 : 10;
      b.style.transform = `translate(${b._x}px,${b._y}px)`;
    });
    return b;
  }
  const focus = (p, k) => { p.focus = k; for (let i = 0; i < p.n; i++) p.bs[i].classList.toggle('foc', i === k); };
  const place = (p, x, y) => { p.w.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`; };
  function setProg(p, v) { p.bar.style.transform = `scaleX(${Math.max(0, Math.min(1, v / 100))})`; p.pct.textContent = Math.round(v) + '%'; }
  function track(p) {
    if (typeof world === 'undefined' || typeof cam === 'undefined' || !world.actor) return;
    const a = world.actor(p.actor);
    if (!a) return;
    a.headPos(v3);
    const s = cam.project(v3);
    if (s && s.visible !== false) place(p, s.x, s.y);
  }
  function close(p, i) {
    if (!p.open) return;
    p.open = false; p.tok++;
    p.w.classList.add('off');
    live.splice(live.indexOf(p), 1); pool.push(p);
    p.res(i);
  }

  function popup(spec) {
    const s = spec || {}, p = pool.pop() || make();
    p.open = true; p.spec = s; p.age = 0; p.life = s.dur || 0; p.tickT = 0;
    p.box.className = 'jv' + (s.shake ? ' shake' : '') + (s.cls ? ' ' + s.cls : '');
    p.box.style.width = s.w ? s.w + 'px' : '';
    const t = s.title ?? 'JARVIS';
    p.title.textContent = t === 'JARVIS' ? '' : t;
    const icon = s.icon || 'warn';
    p.ic.className = 'ic ' + icon;
    p.ic.textContent = icon === 'error' ? '✕' : icon === 'info' ? 'i' : icon === 'warn' ? '!' : '';
    p.msg.textContent = s.msg || '';
    p.spin.classList.toggle('off', !s.spinner);
    p.pr = null; p.prog.classList.add('off');
    if (s.progress) {
      let { from = 0, to = 100, dur = 1 } = s.progress;
      if (from <= 1 && to <= 1) { from *= 100; to *= 100; }
      p.pr = { from, to, dur }; p.prT = 0; setProg(p, from); p.prog.classList.remove('off');
    }
    const labels = s.buttons || ['OK'];
    p.btns.textContent = ''; p.n = labels.length;
    for (let k = 0; k < labels.length; k++) {
      const b = button(p, k);
      b.textContent = labels[k]; b._d = 0; b._x = 0; b._y = 0; b.style.transform = '';
      p.btns.append(b);
    }
    if (p.n) focus(p, 0);
    // position: centre (stacked +18 px per open unanchored pop-up), [x%, y%], or over an actor's head
    p.actor = null; p.stack = false;
    let x = innerWidth / 2, y = innerHeight / 2;
    const at = s.at;
    if (Array.isArray(at)) { const k = at[0] <= 1 && at[1] <= 1 ? 1 : 0.01; x = at[0] * k * innerWidth; y = at[1] * k * innerHeight; }
    else if (at && at.actor) p.actor = at.actor;
    else if (at !== 'center') {
      let n = 0; for (let i = 0; i < live.length; i++) if (live[i].stack) n++;
      x += (n % 14) * 18; y += (n % 14) * 18; p.stack = true;
    }
    place(p, x, y);
    p.z = (s.z || 0) * 10000 + (++seq);
    p.w.style.zIndex = p.z;
    live.push(p);
    p.w.classList.remove('off'); // un-hiding restarts the CSS pop/shake animation
    if (p.actor) track(p);
    if (s.ding !== false) ui.sfx('ding');
    const tok = p.tok;
    const done = new Promise((r) => { p.res = r; });
    return { el: p.w, done, close: () => { if (p.tok === tok) close(p, -1); } };
  }

  popup.clear = () => { while (live.length) close(live[live.length - 1], -1); };
  popup.count = () => live.length;
  popup.update = (dt) => {
    const skip = ui.skipping();
    let top = null;
    for (let i = live.length - 1; i >= 0; i--) {
      const p = live[i];
      p.age += dt;
      if (p.pr) { p.prT += dt; const k = p.pr.dur > 0 ? Math.min(1, p.prT / p.pr.dur) : 1; if (k < 1 || p.prT - dt < p.pr.dur) setProg(p, p.pr.from + (p.pr.to - p.pr.from) * k); }
      if (p.spec.spinner && (p.tickT += dt) >= 1) { p.tickT -= 1; ui.sfx('tick', { vol: 0.3 }); }
      if (p.life > 0 && p.age >= p.life) { close(p, -1); continue; }
      if (p.n && (skip || (TEST.auto && p.age >= 0.3))) { // autoplay presses the first button that doesn't run away
        let k = 0; while (k < p.n - 1 && p.spec.dodge && p.spec.dodge.includes(k)) k++;
        close(p, k); continue;
      }
      if (p.n && (!top || p.z > top.z)) top = p;
    }
    if (top && !say.busy() && input.pressed('yes')) { input.consume('yes'); close(top, top.focus); }
  };
  popup.render = () => { for (let i = 0; i < live.length; i++) if (live[i].actor) track(live[i]); };
  return popup;
})();

// ------------------------------------------------------------ 1987 HUD (top right)
const hud = (() => {
  const el = document.getElementById('hud'), fill = el.querySelector('.bat i'), pct = el.querySelector('.pct'), ns = el.querySelector('.ns');
  const bars = el.querySelectorAll('.bars i');
  const anims = [];
  function show() {
    const b = state.battery, s = state.bars;
    if (b == null && s == null) { el.classList.add('off'); return; }
    el.classList.remove('off');
    fill.style.transform = `scaleX(${b > 0 ? Math.max(0.07, b / 100) : 0})`;
    pct.textContent = (b ?? 0) + '%';
    el.classList.toggle('low', (b ?? 0) <= 5);
    for (let k = 0; k < 4; k++) bars[k].classList.toggle('on', k < (s || 0));
    ns.classList.toggle('off', s !== 0);
  }
  return {
    show,
    set(v) {
      anims.length = 0;
      if (!v) { state.battery = null; state.bars = null; } else { if ('battery' in v) state.battery = v.battery; if ('bars' in v) state.bars = v.bars; }
      show();
    },
    animate(v, dur = 1) { // counts one step at a time
      const ps = [];
      for (const key of ['battery', 'bars']) {
        if (!(key in v)) continue;
        if (ui.skipping()) { state[key] = v[key]; continue; }
        const from = state[key] || 0, n = Math.abs(v[key] - from);
        if (!n) continue;
        ps.push(new Promise((res) => anims.push({ key, to: v[key], step: dur / n, t: 0, res })));
      }
      show();
      return Promise.all(ps);
    },
    update(dt) {
      for (let i = anims.length - 1; i >= 0; i--) {
        const a = anims[i];
        a.t += dt;
        while (a.t >= a.step && state[a.key] !== a.to) { a.t -= a.step; state[a.key] = (state[a.key] || 0) + Math.sign(a.to - (state[a.key] || 0)); show(); }
        if (state[a.key] === a.to) { anims.splice(i, 1); a.res(); }
      }
    },
  };
})();

// ------------------------------------------------------------ portraits (baked at boot from a 3D bust; face texture / silhouette fallback)
const portraitURL = (() => {
  const urls = {}, cvs = {}, S = 128;
  const alias = { student: 'student_a', voice: null, operator: null, assistant: null };
  const blank = () => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
  function bg(x) {
    const g = x.createLinearGradient(0, 0, 0, S); g.addColorStop(0, '#34437a'); g.addColorStop(1, '#1b2448');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
  }
  function silhouette(id) {
    const c = blank(), x = c.getContext('2d');
    bg(x);
    x.fillStyle = '#5d6a99';
    x.beginPath(); x.arc(64, 54, 25, 0, Math.PI * 2); x.fill();
    x.beginPath(); x.ellipse(64, 132, 48, 44, 0, Math.PI, 0); x.fill();
    if (id === 'operator' || id === 'voice') { // a phone line: little sound arcs
      x.strokeStyle = '#ffd21f'; x.lineWidth = 4; x.lineCap = 'round';
      for (let k = 1; k <= 2; k++) { x.beginPath(); x.arc(92, 40, 8 * k, -0.9, 0.9); x.stroke(); }
    }
    return c;
  }
  function fromFace(fc) {
    const c = blank(), x = c.getContext('2d');
    bg(x);
    const k = Math.max(S / fc.width, S / fc.height);
    x.drawImage(fc, (S - fc.width * k) / 2, (S - fc.height * k) / 2, fc.width * k, fc.height * k);
    return c;
  }
  function canvasFor(id) {
    if (cvs[id]) return cvs[id];
    const ch = CHARACTERS[id];
    if (ch && ch.voice && ch.voice.also) { // two speakers at once: split portrait
      const [a, b] = id.split('_'), c = blank(), x = c.getContext('2d');
      x.drawImage(canvasFor(a), S / 4, 0, S / 2, S, 0, 0, S / 2, S);
      x.drawImage(canvasFor(b), S / 4, 0, S / 2, S, S / 2, 0, S / 2, S);
      x.fillStyle = '#ffd21f'; x.fillRect(S / 2 - 1, 0, 2, S);
      return (cvs[id] = c);
    }
    const look = id in alias ? alias[id] : id;
    if (look && look !== id && cvs[look]) return (cvs[id] = cvs[look]);
    let fc = null;
    try {
      const a = look && typeof world !== 'undefined' && world.actor && world.actor(look);
      if (a && a.rig && a.rig.face) fc = a.rig.face.canvas;
      else if (look && LOOKS[look] && typeof buildCharacter === 'function') fc = buildCharacter(look).face.canvas;
    } catch (e) { fc = null; }
    return (cvs[id] = fc ? fromFace(fc) : silhouette(id));
  }
  function portraitURL(id) { return urls[id] || (urls[id] = canvasFor(id).toDataURL()); }
  portraitURL.bake = (id, canvas) => { cvs[id] = canvas; delete urls[id]; };
  return portraitURL;
})();

// ------------------------------------------------------------ menus: title, main, options, controls, scene select, extras, pause
const menus = (() => {
  const titleEl = document.getElementById('title'), root = document.getElementById('menu');

    ['Move', 'WASD or arrows', 'Left stick', 'Left virtual stick'],
    ['YES (confirm, examine, advance)', 'Enter, Space, left click', 'A', 'YES button'],
    ['NO (cancel, duck, fast-forward)', 'Escape, Backspace, right click', 'B', 'NO button'],
    ['Run', 'Shift', 'RB', 'Push the stick further'],
    ['Swap', 'Tab', 'Y', 'SWAP button'],
    ['Inventory', 'I', 'X', 'BAG button'],

  const cyc = (key, vals, names) => ({
    label: null, val: () => '‹ ' + names[Math.max(0, vals.indexOf(options[key]))] + ' ›',
    adj: (d) => { options[key] = vals[(vals.indexOf(options[key]) + d + vals.length) % vals.length]; applyOptions(); },
  });

  function applyOptions() {
    document.body.classList.toggle('large', options.textSize === 'large');

    emit('options', options);
  }
  function btn(k) {
    let b = btns[k];
    if (b) return b;
    b = btns[k] = document.createElement('button'); b._k = k;
    b.append(document.createElement('span'), document.createElement('em'));
    b.addEventListener('click', () => { if (M.mode === 'menu') { sel = b._k; paint(); act(); } });
    b.addEventListener('pointerenter', () => { if (M.mode === 'menu' && sel !== b._k) { sel = b._k; paint(); } });
    return b;
  }
  function show(h, its, bk, o = {}) {
    head.textContent = h || ''; items = its; back = bk || null;
    sel = Math.min(o.sel || 0, its.length - 1);
    body.textContent = '';
    if (o.body) body.append(o.body); else if (o.html) body.innerHTML = o.html;
    foot.textContent = o.foot ?? (bk ? 'YES — Select · NO — Back' : 'YES — Select');
    const low = o.low && !M.paused;
    root.className = low ? 'low' : 'dim';
    titleEl.classList.toggle('off', !(onTitle && low));
    list.textContent = '';
    for (let k = 0; k < its.length; k++) list.append(btn(k));
    paint();
    M.mode = 'menu';
  }
  function paint() {
    for (let k = 0; k < items.length; k++) {
      const it = items[k], b = btns[k];
      b.firstChild.textContent = it.label;
      b.lastChild.textContent = it.val ? it.val() : (it.sub || '');
      b.lastChild.style.display = it.val || it.sub ? '' : 'none';
      b.className = (k === sel ? 'sel' : '') + (it.dis ? ' dis' : '');
    }
    if (btns[sel] && items.length > 8) btns[sel].scrollIntoView({ block: 'nearest' });
  }
  function act() {
    const it = items[sel];
    if (!it) return;
    if (it.dis) { ui.sfx('clunk'); return; }
    if (it.act) { ui.sfx('pop', { vol: 0.5 }); it.act(); } else if (it.adj) { it.adj(1); paint(); }
  }
  const confirm = (q, yes, no) => show(q, [{ label: 'YES', act: yes }, { label: 'NO', act: no }], no);

  // ---------------------------------------------------------- screens
  function mainMenu() {
    const its = [];
    if (hasSave()) its.push({ label: 'Continue', act: cont });
    its.push({ label: 'New Game', act: () => (hasSave() ? confirm('Start a new game? Your saved game will be replaced.', newGame, mainMenu) : newGame()) });
    its.push({ label: 'Options', act: () => optionsMenu(mainMenu) });
